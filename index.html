<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecture Intelligente</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C0603A' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M12 6.5C10.5 5 8 4.5 4 4.8v12.5c4-.3 6.5.2 8 1.7'/><path d='M12 6.5C13.5 5 16 4.5 20 4.8v12.5c-4-.3-6.5.2-8 1.7'/><path d='M12 6.5V19'/></svg>"/>
  <!-- Polices auto-hébergées (Newsreader, Work Sans, Material Symbols) :
       aucune connexion à Google, et disponibles hors-ligne -->
  <link href="fonts/fonts.css" rel="stylesheet"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#C0603A"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <!-- pdf.js + jszip auto-hébergés : l'app fonctionne 100 % hors-ligne, zéro CDN -->
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <style>
    :root {
      /* Warm paper palette — d'après le prototype « Lecture Intelligente » */
      --page: linear-gradient(160deg, #ECE2D2 0%, #E4D8C4 100%); /* fond crème de la scène */
      --bg: #FBF8F2;           /* papier — surface principale */
      --bg2: #F3EBDC;          /* carte / champ chaud */
      --bg3: #EADFCB;          /* survol profond / plateau de lecture */
      --text: #2A2520;         /* encre */
      --text2: #6F665A;        /* texte secondaire */
      --text3: #9C8F78;        /* texte tertiaire */
      --border: rgba(120,105,85,0.16);  /* filet chaud */
      --border2: rgba(120,105,85,0.28);
      --border3: rgba(120,105,85,0.42);
      --hover: rgba(120,105,85,0.08);
      --hover-strong: rgba(120,105,85,0.14);
      --accent: #C0603A;       /* corail */
      --accent-hover: #A94F2F;
      --highlight: rgba(244,210,114,0.45);  /* surlignage jaune */
      --success: #5E7B52;
      --warning: #C77A34;
      --danger: #B4402E;
      --shadow-sm: rgba(60,45,30,0.10) 0px 0px 0px 1px;
      --shadow: rgba(60,45,30,0.06) 0px 0px 0px 1px, rgba(60,45,30,0.12) 0px 3px 8px, rgba(60,45,30,0.18) 0px 12px 30px;
      --shadow-lg: rgba(60,45,30,0.06) 0px 0px 0px 1px, rgba(60,45,30,0.14) 0px 8px 20px, rgba(60,45,30,0.24) 0px 24px 55px;
      --radius: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        /* Warm espresso dark — pendant nocturne du thème papier */
        --page: linear-gradient(160deg, #221C16 0%, #17130F 100%);
        --bg: #1E1912;
        --bg2: #271F17;
        --bg3: #342A20;
        --text: rgba(245,238,228,0.90);
        --text2: rgba(245,238,228,0.52);
        --text3: rgba(245,238,228,0.32);
        --border: rgba(245,238,228,0.10);
        --border2: rgba(245,238,228,0.15);
        --border3: rgba(245,238,228,0.24);
        --hover: rgba(245,238,228,0.06);
        --hover-strong: rgba(245,238,228,0.10);
        --accent: #D2764B;
        --accent-hover: #E08C5F;
        --highlight: rgba(244,210,114,0.28);
        --shadow-sm: rgba(0,0,0,0.4) 0px 0px 0px 1px;
        --shadow: rgba(0,0,0,0.4) 0px 0px 0px 1px, rgba(0,0,0,0.45) 0px 3px 8px, rgba(0,0,0,0.55) 0px 12px 30px;
        --shadow-lg: rgba(0,0,0,0.4) 0px 0px 0px 1px, rgba(0,0,0,0.5) 0px 8px 20px, rgba(0,0,0,0.6) 0px 24px 55px;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* Material Symbols — icônes minimalistes (fonts.google.com/icons) */
    .ms { font-family: 'Material Symbols Outlined'; font-weight: 300; font-style: normal; font-size: 18px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; vertical-align: -4px; user-select: none; -webkit-font-smoothing: antialiased; font-variation-settings: 'opsz' 24; }
    body { background: var(--page); background-attachment: fixed; color: var(--text); font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    button, input, textarea, select { font-family: inherit; color: inherit; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--highlight); }
    .layout { display: flex; height: 100vh; height: 100dvh; width: 100%; }
    button, .checklist-item, .type-card { touch-action: manipulation; }
    #pdf-panel { display: none; flex-direction: column; background: var(--bg2); border-right: 0.5px solid var(--border); min-width: 280px; max-width: 75vw; position: relative; }
    #pdf-panel.active { display: flex; flex: 0 0 50%; }
    /* ------------------------------------------------------------
       Échelle des superpositions (unique pour toute l'app) :
         5    .top-bar (sticky)          210  .ambient-panel
         300  #pdf-panel.fullscreen      310  méthode (pdf-mode .main-scroll)
         320  #method-dock               340  .hl-popup (bulle surlignage)
         500  #dash-modal                520  #ai-popup
         540  #dict-popup                600  #lib-modal
         620  #dict-side                 640  #dict-split
         660  .anki-help-modal           900  #yt-theater
         1000 .toast (au-dessus de tout)
       Toute nouvelle couche doit prendre une valeur libre de cette liste.
       ------------------------------------------------------------ */
    #pdf-panel.fullscreen { position: fixed; inset: 0; z-index: 300; width: 100vw; height: 100vh; height: 100dvh; max-width: none; border: none; }
    .pdf-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 0.5px solid var(--border); background: var(--bg); flex-wrap: wrap; }
    .pdf-toolbar button, .pdf-toolbar label.btn { padding: 6px 10px; border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); border-radius: var(--radius); font-family: inherit; font-size: 12px; cursor: pointer; }
    .pdf-toolbar button:hover:not(:disabled), .pdf-toolbar label.btn:hover { background: var(--bg3); }
    .pdf-toolbar button:disabled { opacity: .4; cursor: default; }
    .pdf-toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pdf-toolbar button.highlight-btn { background: #F4D272; color: #4A3A15; border-color: #E3BE55; font-weight: 600; }
    .pdf-toolbar button.highlight-btn:hover { background: #EFC85B; opacity: 1; }
    .pdf-toolbar .pdf-info { font-size: 12px; color: var(--text2); margin-left: auto; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* scrollbar-gutter: stable → la barre de défilement est TOUJOURS réservée,
       donc la largeur du viewer ne saute plus de ~15px quand elle apparaît :
       sans ça, chaque rendu faisait osciller la largeur → le ResizeObserver
       rebouclait → le PDF clignotait à l'ouverture. */
    .pdf-viewer { flex: 1; overflow: auto; scrollbar-gutter: stable; background: var(--bg3); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; scroll-behavior: smooth; }
    .pdf-page-slot { position: relative; background: #FBF8F2; box-shadow: 0 6px 20px -8px rgba(60,45,30,.4); display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 12px; border-radius: 4px; }
    .pdf-page-slot::before { content: attr(data-page-label); position: absolute; top: -22px; left: 0; font-size: 10px; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; }
    .pdf-canvas-wrap { position: relative; box-shadow: 0 6px 20px -8px rgba(60,45,30,.4); background: #FBF8F2; border-radius: 4px; }
    .pdf-canvas-wrap canvas { display: block; max-width: 100%; height: auto; }
    .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; opacity: 0.25; line-height: 1.0; }
    .textLayer > span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .textLayer ::selection { background: var(--highlight); }
    .textLayer ::-moz-selection { background: var(--highlight); }
    .pdf-empty { padding: 2rem 1rem; text-align: center; color: var(--text2); font-size: 13px; line-height: 1.6; }
    .pdf-empty label { display: inline-block; margin-top: 1rem; padding: 10px 16px; background: var(--text); color: var(--bg); border-radius: var(--radius); cursor: pointer; font-weight: 500; }
    .pdf-empty-books { margin: 1.6rem auto 0; text-align: left; max-width: 340px; }
    .pdf-empty-books h5 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; font-weight: 500; }
    .pdf-empty-book { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin-bottom: 6px; border: none; background: var(--bg2); border-radius: var(--radius); cursor: pointer; font-family: inherit; text-align: left; box-shadow: inset 0 0 0 1px var(--border); transition: background .1s; color: var(--text2); }
    .pdf-empty-book:hover { background: var(--hover); }
    .pdf-empty-book-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .pdf-empty-book-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pdf-empty-book-sub { font-size: 11.5px; color: var(--text3); }
    .highlights-bar { padding: 8px 12px; border-top: 0.5px solid var(--border); background: var(--bg); font-size: 12px; color: var(--text2); max-height: 140px; overflow-y: auto; }
    .highlights-bar h5 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; font-weight: 500; }
    .hl-item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 0.5px dashed var(--border); }
    .hl-item:last-child { border-bottom: none; }
    .hl-page { flex: 0 0 auto; font-size: 10px; padding: 2px 6px; background: var(--bg2); border-radius: 4px; margin-top: 2px; }
    .hl-text { flex: 1; line-height: 1.4; font-size: 12px; }
    .hl-del { flex: 0 0 auto; background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 0 4px; }
    .hl-del:hover { color: var(--accent); }
    .hl-popup { position: absolute; z-index: 340; background: var(--text); color: var(--bg); padding: 0; border-radius: var(--radius); font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); display: none; animation: hlFadeIn .15s ease; }
    .hl-popup button { background: transparent; color: var(--bg); border: none; font-family: inherit; font-size: 13px; cursor: pointer; padding: 8px 14px; display: flex; align-items: center; gap: 6px; font-weight: 500; border-radius: var(--radius); }
    .hl-popup button:hover { background: rgba(255,255,255,.1); }
    .hl-popup::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--text); }
    @keyframes hlFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    #resizer { width: 6px; cursor: col-resize; background: var(--border); flex-shrink: 0; }
    #resizer:hover { background: var(--border2); }
    #pdf-panel:not(.active) + #resizer { display: none; }
    .main-scroll { flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 2rem 1rem 4rem; }
    .app { width: 100%; max-width: 620px; position: relative; }
    /* Accueil : le site s'adapte à la taille de l'écran (grille plus large) */
    .app.app-wide { max-width: 1100px; }
    /* Mode lecture PDF : le PDF prend tout, la méthode devient un dock façon
       barre des tâches au centre-bas, qui se déplie en popup.
       Alternative « écran séparé » (bouton vertical_split de la toolbar) :
       pdf-mode n'est pas posé → layout côte à côte PDF | méthode d'origine,
       avec la poignée #resizer. Choix persistant (localStorage li-pdf-split). */
    #method-dock { display: none; }
    .layout.pdf-mode #pdf-panel.active { flex: 1 1 auto; max-width: none; }
    .layout.pdf-mode #resizer { display: none; }
    .layout.pdf-mode .main-scroll {
      position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
      width: min(680px, 94vw); max-height: 72vh; padding: 1.1rem 1rem 1.4rem;
      background: var(--bg); border: 1px solid var(--border2); border-radius: 18px;
      box-shadow: 0 18px 50px rgba(40,30,20,.34); z-index: 310; display: none;
    }
    .layout.pdf-mode.method-open .main-scroll { display: flex; animation: methodPop .16s ease; }
    @keyframes methodPop { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .layout.pdf-mode #method-dock {
      display: inline-flex; align-items: center; gap: 8px; position: fixed;
      left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 320;
      padding: 10px 18px; border: none; border-radius: 999px;
      background: var(--text); color: var(--bg); cursor: pointer; font-family: inherit;
      font-size: 13px; font-weight: 600; box-shadow: 0 8px 26px rgba(40,30,20,.36);
      transition: transform .12s, background .12s; max-width: 90vw;
    }
    .layout.pdf-mode #method-dock:hover { transform: translateX(-50%) translateY(-1px); }
    .layout.pdf-mode.method-open #method-dock { background: var(--accent); color: #fff; }
    #method-dock-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .method-dock-chev { font-size: 18px; transition: transform .18s; }
    .layout.pdf-mode.method-open .method-dock-chev { transform: rotate(180deg); }
    .top-bar { position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: .5rem 0; margin: -2rem 0 2rem; z-index: 5; display: flex; justify-content: flex-start; align-items: center; gap: 2px; border-bottom: 1px solid var(--border); }
    .top-bar .app-title { margin-right: auto; }
    .btn-pdf-toggle { padding: 4px 8px; border: none; background: transparent; color: var(--text2); border-radius: var(--radius); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .1s; height: 36px; min-width: 36px; flex-shrink: 0; }
    .btn-pdf-toggle:hover { background: var(--hover); color: var(--text); }
    .btn-pdf-toggle.active { background: var(--hover-strong); color: var(--text); }
    .app-title { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 19px; font-weight: 500; color: var(--text); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    /* Liens de navigation (refonte Papier) : Bibliothèque · Sujets · Fiches */
    .top-nav { display: flex; gap: 4px; margin-right: 8px; }
    .top-nav button { border: none; background: none; font-family: inherit; font-size: 13.5px; color: var(--text2); cursor: pointer; padding: 6px 9px; border-radius: var(--radius); font-weight: 500; transition: color .1s, background .1s; }
    .top-nav button:hover { color: var(--text); background: var(--hover); }
    .app-logo { color: var(--accent); flex-shrink: 0; }
    .app-title:hover .app-logo { transform-origin: 12px 12px; animation: pulseLogo 1.4s ease-in-out infinite; }
    @keyframes pulseLogo { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .75; } }
    .phase-bar { display: flex; margin-bottom: 1.5rem; gap: 4px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
    .phase-tab { padding: 6px 12px; font-size: 14px; font-weight: 500; text-align: center; color: var(--text3); line-height: 1.3; transition: all .1s; cursor: default; position: relative; margin-bottom: -1px; }
    .phase-tab.active { color: var(--text); border-bottom: 2px solid var(--text); }
    .phase-tab.done { color: var(--text2); }
    .progress-dots { display: flex; gap: 5px; margin-bottom: 2.2rem; flex-wrap: wrap; }
    .dot { width: 26px; height: 3px; border-radius: 2px; background: var(--bg3); transition: all .2s ease; }
    .dot.active { background: var(--accent); }
    .dot.done { background: var(--border3); }
    .step-number { font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: 0; text-transform: none; margin-bottom: .5rem; }
    .step-title { font-family: 'Newsreader', Georgia, serif; font-size: 38px; font-weight: 500; line-height: 1.12; margin-bottom: 1.75rem; letter-spacing: -0.015em; color: var(--text); }
    .step-why { font-size: 14px; color: var(--text2); line-height: 1.6; padding: 12px 16px 12px 18px; background: var(--bg2); border-radius: var(--radius); margin-bottom: 1.5rem; border: none; }
    .example-box { background: var(--bg2); border: none; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 1.5rem; font-size: 14px; color: var(--text); line-height: 1.55; box-shadow: inset 0 0 0 1px var(--border); }
    .example-box strong { color: var(--text2); font-weight: 600; font-size: 12px; display: block; margin-bottom: 6px; letter-spacing: 0; text-transform: none; }
    .field { margin-bottom: 1.25rem; position: relative; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .field input, .field textarea { width: 100%; padding: 8px 36px 8px 10px; border: 1px solid transparent; border-radius: var(--radius); font-family: inherit; font-size: 14px; background: var(--bg2); color: var(--text); resize: vertical; line-height: 1.5; transition: background .1s, box-shadow .1s; box-shadow: inset 0 0 0 1px var(--border); }
    .field input:hover, .field textarea:hover { background: var(--bg3); }
    .field input:focus, .field textarea:focus { outline: none; background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
    .field textarea { min-height: 70px; padding: 10px 36px 10px 12px; }
    .mic-btn { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; padding: 0; }
    .mic-btn:hover { background: var(--bg3); color: var(--text); }
    .mic-btn.listening { background: var(--accent); color: #fff; border-color: var(--accent); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(194,65,12,.4); } 50% { box-shadow: 0 0 0 6px rgba(194,65,12,0); } }
    .block-step { display: flex; gap: 10px; margin-bottom: 6px; align-items: flex-start; padding: 6px 8px; border-radius: var(--radius); }
    .block-step:hover { background: var(--hover); }
    .block-num { min-width: 22px; height: 22px; background: var(--bg3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 1px; color: var(--text2); }
    .block-text { font-size: 14px; color: var(--text); line-height: 1.5; padding-top: 2px; }
    .checklist-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--radius); margin-bottom: 2px; cursor: pointer; transition: background .1s; font-size: 14px; color: var(--text); }
    .checklist-item:hover { background: var(--hover); }
    .check-box { width: 18px; height: 18px; border: 1.5px solid var(--border3); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .1s; background: var(--bg); }
    .check-box.checked { background: var(--accent); border-color: var(--accent); }
    .check-tick { display: none; width: 8px; height: 5px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(1px,-1px); }
    .check-box.checked .check-tick { display: block; }
    /* Accueil : héros + grille « Reprendre » (même esprit qu'Écoute Intelligente) */
    .home-hero { text-align: center; padding: 2.4rem 0 1.6rem; }
    .home-eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--text3); font-weight: 600; margin-bottom: 14px; }
    .home-title { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(36px, 6vw, 46px); line-height: 1.05; letter-spacing: -0.015em; color: var(--text); }
    .home-sub { margin: 12px auto 0; font-size: 15px; color: var(--text2); line-height: 1.6; max-width: 420px; }
    .home-actions { margin-top: 1.4rem; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .home-open-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border: none; background: var(--accent); color: #fff; border-radius: var(--radius); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s, transform .1s; box-shadow: 0 10px 24px -10px rgba(192,96,58,.85); }
    .home-open-btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 14px 30px -10px rgba(192,96,58,.9); }
    .home-open-folder { background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--border2); }
    .home-open-folder:hover { background: var(--bg2); }
    .home-download { margin-top: 1rem; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .home-download-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; color: var(--accent); text-decoration: none; padding: 4px 10px; border-radius: var(--radius); transition: background .1s; }
    .home-download-link:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .home-download-note { font-size: 11.5px; color: var(--text3); }
    .home-label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--text3); margin: 1.8rem 0 .9rem; }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }

    /* Mode cinéma — vidéo + notes sans sortir de l'app */
    #yt-theater { position: fixed; inset: 0; z-index: 900; display: none; flex-direction: column; background: #14100C; color: rgba(245,238,228,0.9); }
    #yt-theater.open { display: flex; }
    .ytt-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; background: #1E1912; border-bottom: 1px solid rgba(245,238,228,0.1); flex-shrink: 0; }
    .ytt-bar strong { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ytt-bar-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .ytt-btn { padding: 5px 12px; border: none; background: rgba(245,238,228,0.08); color: rgba(245,238,228,0.85); border-radius: var(--radius); font-family: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; height: 30px; }
    .ytt-btn:hover { background: rgba(245,238,228,0.16); }
    .ytt-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 14px; }
    #ytt-stage { width: 100%; max-width: 960px; }
    .ytt-player-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
    .ytt-player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .ytt-setup { background: rgba(245,238,228,0.05); border-radius: var(--radius-lg); padding: 20px 22px; font-size: 14px; line-height: 1.6; }
    .ytt-setup p { margin-bottom: 12px; }
    .ytt-or { text-align: center; color: rgba(245,238,228,0.4); font-size: 12px; }
    .ytt-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .ytt-row input { flex: 1; padding: 8px 12px; border: none; border-radius: var(--radius); font-family: inherit; font-size: 13px; background: rgba(245,238,228,0.1); color: rgba(245,238,228,0.9); }
    .ytt-row input:focus { outline: 1px solid var(--accent); }
    .ytt-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .ytt-result { cursor: pointer; border-radius: var(--radius); overflow: hidden; background: rgba(245,238,228,0.05); transition: background .1s, transform .1s; }
    .ytt-result:hover { background: rgba(245,238,228,0.12); transform: translateY(-2px); }
    .ytt-result img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .ytt-result-info { padding: 8px 10px; }
    .ytt-result-info strong { display: block; font-size: 13px; font-weight: 500; line-height: 1.35; margin-bottom: 3px; }
    .ytt-result-info span { font-size: 12px; color: rgba(245,238,228,0.5); }
    .ytt-notes { width: 100%; max-width: 960px; }
    .ytt-notes label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .ytt-notes-hint { font-weight: 400; color: rgba(245,238,228,0.4); font-size: 12px; }
    .ytt-notes textarea { width: 100%; padding: 12px 40px 12px 14px; border: none; border-radius: var(--radius); font-family: inherit; font-size: 14px; background: rgba(245,238,228,0.08); color: rgba(245,238,228,0.9); resize: vertical; line-height: 1.55; min-height: 110px; }
    .ytt-notes textarea:focus { outline: 1px solid var(--accent); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: var(--radius); font-size: 13px; z-index: 1000; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      #pdf-panel.active { flex: 0 0 50vh; flex-basis: 50dvh; max-width: 100%; min-width: 0; border-right: none; border-bottom: 0.5px solid var(--border); }
      #resizer { display: none; }
      .checklist-item { padding: 10px 8px; }
      .block-step { padding: 8px; }
    }
    @media (max-width: 480px) {
      .main-scroll { padding: 1.25rem .75rem 3rem; }
      .top-bar { overflow-x: auto; scrollbar-width: none; }
      .top-bar::-webkit-scrollbar { display: none; }
      .app-title { font-size: 16px; }
      .top-nav { gap: 0; margin-right: 4px; }
      .top-nav button { font-size: 12.5px; padding: 6px 6px; }
      .step-title { font-size: 26px; }
      .timer-time { font-size: 36px; }
      .phase-tab { padding: 6px 8px; font-size: 13px; }
      .pdf-toolbar button, .pdf-toolbar label.btn { min-height: 36px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="pdf-panel">
    <div class="pdf-toolbar">
      <button id="pdf-prev" disabled>‹</button>
      <span id="pdf-pagenum" style="font-size:12px;color:var(--text2)">—</span>
      <button id="pdf-next" disabled>›</button>
      <button id="pdf-zoom-out" disabled>−</button>
      <button id="pdf-zoom-in" disabled>+</button>
      <button id="pdf-fit" title="Ajuster à la largeur"><span class="ms" style="font-size:16px">fit_screen</span></button>
      <button id="pdf-highlight" class="highlight-btn" disabled title="Surligner la sélection (Ctrl+H)"><span class="ms" style="font-size:16px">ink_highlighter</span> Surligner</button>
      <button id="pdf-fullscreen" title="Plein écran"><span class="ms" style="font-size:16px">fullscreen</span></button>
      <button id="pdf-split" title="Écran séparé : PDF | méthode"><span class="ms" style="font-size:16px">vertical_split</span></button>
      <span class="pdf-info" id="pdf-filename"></span>
    </div>
    <div class="pdf-viewer" id="pdf-viewer">
      <div class="pdf-empty">
        Aucun PDF ouvert.<br>
        <label>Sélectionner un fichier<input type="file" accept="application/pdf" style="display:none" onchange="loadPdfFromInput(event)"/></label>
      </div>
    </div>
  </div>
  <div id="resizer"></div>
  <div class="main-scroll">
    <div class="app" id="app"></div>
  </div>
  <button id="method-dock" title="Afficher / masquer ma méthode">
    <span class="ms">menu_book</span>
    <span id="method-dock-label">Ma méthode</span>
    <span class="ms method-dock-chev">expand_less</span>
  </button>
</div>
<div class="toast" id="toast"></div>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
}

const STEPS_LIVRE = [
  {phase:0,id:'type',title:'Type de note',num:'Démarrage'},
  {phase:0,id:'ppu',title:'Définis ton objectif PPU',num:'Pré-lecture · 1/3'},
  {phase:0,id:'tdm',title:'Repère les chapitres clés',num:'Pré-lecture · 2/3'},
  {phase:0,id:'env',title:'Prépare ton environnement',num:'Pré-lecture · 3/3'},
  {phase:1,id:'lecture',title:'Lecture active par blocs',num:'Lecture · 1/2'},
  {phase:1,id:'pomodoro',title:'Lance ton bloc de lecture',num:'Lecture · 2/2'},
  {phase:2,id:'synthese',title:'Synthèse en 5 idées',num:'Post-lecture · 1/2'},
  {phase:2,id:'action',title:'Passe à l\'action',num:'Post-lecture · 2/2'},
];
const STEPS_CHAPITRE = [
  {phase:0,id:'type',title:'Type de note',num:'Démarrage'},
  {phase:0,id:'ppu',title:'Objectif du chapitre',num:'Pré-lecture · 1/2'},
  {phase:0,id:'env',title:'Prépare ton environnement',num:'Pré-lecture · 2/2'},
  {phase:1,id:'lecture',title:'Lecture active par blocs',num:'Lecture · 1/2'},
  {phase:1,id:'pomodoro',title:'Lance ton bloc de lecture',num:'Lecture · 2/2'},
  {phase:2,id:'synthese',title:'Synthèse du chapitre',num:'Post-lecture · 1/2'},
  {phase:2,id:'action',title:'Passe à l\'action',num:'Post-lecture · 2/2'},
];
const PHASES = ['Pré-lecture','Lecture','Post-lecture'];

// Méthode « Maîtriser un sujet » (d'après Oussama Ammar) —
// deux phases : cadrage rapide puis travail en profondeur.
const STEPS_SUJET = [
  {phase:0,id:'type',title:'Type de note',num:'Démarrage'},
  {phase:0,id:'suj-yt',title:'Dégrossis sur YouTube',num:'Cadrage · 1/2'},
  {phase:0,id:'suj-carto',title:'Cartographie les concepts',num:'Cadrage · 2/2'},
  {phase:1,id:'suj-livres',title:'Lis en diagonale les références',num:'Profondeur · 1/2'},
  {phase:1,id:'suj-50q',title:'Le crash-test des 50 questions',num:'Profondeur · 2/2'},
];
const PHASES_SUJET = ['Cadrage','Profondeur'];

function sujetInitial() {
  return {
    id: null, sujet:'', videos:'', carto:'', cartoLien:'', livres:'',
    questions: [],        // [{ q, avis: [{ text, ts }] }]
    qIndex: 0,
    ytVideos: [],         // suggestions IA [{ titre, requete, raison }]
    livresSugg: [],       // suggestions IA [{ titre, auteur, raison }]
    ytChecks:{'Sujet recherché sur YouTube':false,'Une dizaine de vidéos les plus vues sélectionnées':false,'Visionnées en accéléré, notes prises':false}
  };
}

// --- Persistance des sujets (localStorage) : chaque sujet est un
// dossier qu'on retrouve sur l'accueil sans repasser le parcours ---
function sujetsAll() { try { return JSON.parse(localStorage.getItem('li-sujets') || '[]'); } catch (_) { return []; } }
function sujetsWrite(list) { localStorage.setItem('li-sujets', JSON.stringify(list)); }
function sujetPersist() {
  const su = state.sujet;
  if (!su || !su.sujet || !su.sujet.trim()) return;
  if (!su.id) su.id = Date.now();
  su.updatedAt = Date.now();
  const list = sujetsAll();
  const i = list.findIndex(x => x.id === su.id);
  if (i >= 0) list[i] = su; else list.push(su);
  sujetsWrite(list);
  document.dispatchEvent(new CustomEvent('li:changed')); // synchro cloud différée
}
function sujetAnsweredCount(su) { return (su.questions || []).filter(q => (q.avis || []).length > 0).length; }

const state = {
  step: 0,
  noteType: null,
  bookTitle: '',
  bookAuthor: '',
  chapterTitle: '',
  // Ces éléments de début de note suivent le PDF visionné tant que
  // l'utilisateur ne les a pas saisis à la main (édition = coupe le suivi).
  _titleAuto: true,
  _authorAuto: true,
  _chapterAuto: true,
  ppu: {perso:'',precis:'',utile:''},
  tdm: {chapitres:'',ordre:''},
  env: {'Créneau calme bloqué':false,'Notifications coupées (mode avion)':false,'Eau à portée':false,'Lumière et position confortables':false},
  lecture: {question:''},
  timer: {seconds:25*60,running:false,interval:null,phase:'work',blocks:0},
  synthese: ['','','','',''],
  action: {conseil:'',quand:'',deadline:''},
  highlights: [],
  sujet: sujetInitial(),
  pdfPanelOpen: false,
  done: false,
  // ID de la fiche écrite en IndexedDB à la fin du flux (null tant que
  // l'écriture n'a pas abouti) — sert de filet anti-perte au rechargement.
  _savedNoteId: null,
  // ID du brouillon (« Notes en cours » de l'accueil) si la note a été quittée
  _draftId: null
};

const pdf = { doc: null, page: 1, total: 0, scale: 1.2, name: '', textLayerDiv: null, fit: true };

// =============================================================
// Persistance de la session : tout le travail en cours (étape,
// titres, PPU, synthèse, citations…) survit aux rechargements —
// y compris ceux déclenchés automatiquement par update.js.
// =============================================================
const SESSION_KEY = 'li-session-v1';
let _persistTimer = null;
function _sessionSnapshot() {
  // timer.interval (handle) et running ne sont pas rejouables après reload
  // savedAt permet à la synchro cloud de garder la session la plus récente
  return JSON.stringify(Object.assign({}, state, {
    timer: Object.assign({}, state.timer, { interval: null, running: false }),
    savedAt: Date.now()
  }));
}
function persistState() {
  clearTimeout(_persistTimer);
  _persistTimer = setTimeout(() => {
    try { localStorage.setItem(SESSION_KEY, _sessionSnapshot()); } catch (_) {}
  }, 300);
}
function restoreState() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== 'object') return;
    // Session terminée ET fiche bien écrite en base : on repart de l'accueil.
    // Sans _savedNoteId (crash entre l'écran de fin et l'écriture IndexedDB),
    // on restaure l'écran de fin : l'auto-save de notes.js rattrapera la fiche.
    if (saved.done && saved._savedNoteId) { localStorage.removeItem(SESSION_KEY); return; }
    _applySnapshot(saved);
    // Rassurer : le travail en cours a bien été retrouvé (restauration muette sinon)
    if (state.step > 0 || state.noteType || state.bookTitle) {
      setTimeout(() => { try { showToast('Session précédente restaurée ✓'); } catch (_) {} }, 800);
    }
  } catch (_) { try { localStorage.removeItem(SESSION_KEY); } catch (_) {} }
}
// Saisie au clavier / cases cochées → sauvegarde (debouncée)
document.addEventListener('input', persistState);
document.addEventListener('change', persistState);
// Fermeture ou rechargement → flush immédiat
window.addEventListener('beforeunload', () => {
  clearTimeout(_persistTimer);
  try { localStorage.setItem(SESSION_KEY, _sessionSnapshot()); } catch (_) {}
});

// Réhydrate `state` depuis un instantané (session ou brouillon)
function _applySnapshot(saved) {
  for (const k of Object.keys(state)) {
    if (!(k in saved)) continue;
    if (k === 'timer') Object.assign(state.timer, saved.timer, { interval: null, running: false });
    else if (k === 'sujet') state.sujet = Object.assign(sujetInitial(), saved.sujet);
    else if (state[k] && typeof state[k] === 'object' && !Array.isArray(state[k])) Object.assign(state[k], saved[k]);
    else state[k] = saved[k];
  }
}

// Remet la session à zéro (nouvelle note) — utilisé par « Recommencer »,
// la reprise d'un brouillon et le démarrage d'une note pendant qu'une autre
// est en brouillon.
function resetSessionState() {
  clearInterval(state.timer.interval);
  Object.assign(state, {
    step:0, noteType:null, bookTitle:'', bookAuthor:'', chapterTitle:'',
    _titleAuto:true, _authorAuto:true, _chapterAuto:true,
    ppu:{perso:'',precis:'',utile:''}, tdm:{chapitres:'',ordre:''},
    env:{'Créneau calme bloqué':false,'Notifications coupées (mode avion)':false,'Eau à portée':false,'Lumière et position confortables':false},
    lecture:{question:''}, timer:{seconds:25*60,running:false,interval:null,phase:'work',blocks:0},
    synthese:['','','','',''], action:{conseil:'',quand:'',deadline:''},
    highlights: [], sujet: sujetInitial(), done:false, _savedNoteId:null, _draftId:null
  });
}

// =============================================================
// Brouillons (« Notes en cours ») : quitter une note l'enregistre
// automatiquement ; l'accueil propose de la reprendre. Les sujets sont
// exclus (ils ont déjà leur suivi « Mes sujets » sur l'accueil).
// =============================================================
const DRAFTS_KEY = 'li-drafts-v1';
function _draftsAll() {
  try { const a = JSON.parse(localStorage.getItem(DRAFTS_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch (_) { return []; }
}
function _draftsWrite(list) { try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(list.slice(0, 12))); } catch (_) {} }

// La note en cours mérite-t-elle un brouillon ? (du contenu, pas terminée)
function _draftWorthy() {
  if (state.done || !state.noteType || state.noteType === 'sujet') return false;
  return !!((state.bookTitle || '').trim() || (state.chapterTitle || '').trim()
    || state.ppu.perso || state.ppu.precis || state.ppu.utile
    || state.lecture.question || state.tdm.chapitres
    || state.synthese.some(x => x && x.trim())
    || state.action.conseil || state.highlights.length);
}

function saveDraftIfAny() {
  if (!_draftWorthy()) return false;
  if (!state._draftId) state._draftId = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const snap = JSON.parse(_sessionSnapshot());
  const prev = _draftsAll().find(d => d.id === state._draftId);
  // Mise à jour depuis l'accueil (step 0) : on garde l'étape où la note avait
  // été laissée, pour la reprendre au bon endroit du flux.
  if (snap.step === 0 && prev && prev.snap && prev.snap.step > 0) snap.step = prev.snap.step;
  const list = _draftsAll().filter(d => d.id !== state._draftId);
  list.unshift({ id: state._draftId, savedAt: Date.now(), snap });
  _draftsWrite(list);
  return true;
}

window.liDeleteDraft = function(id, opts) {
  opts = opts || {};
  if (!opts.silent && !confirm('Supprimer cette note en cours ? Son contenu sera perdu.')) return;
  _draftsWrite(_draftsAll().filter(d => d.id !== id));
  if (state._draftId === id) state._draftId = null;
  if (!opts.silent) re();
};

window.liResumeDraft = function(id) {
  const d = _draftsAll().find(x => x.id === id);
  if (!d || !d.snap) { showToast('Brouillon introuvable'); return; }
  resetSessionState();
  _applySnapshot(d.snap);
  state._draftId = d.id;
  state.done = false;
  render();
  persistState();
  showToast('Note reprise — continue où tu t\'étais arrêté');
  // Rouvrir le livre de la note depuis la bibliothèque (à la dernière page lue)
  const title = (state.bookTitle || '').trim();
  if (title && typeof libGetAll === 'function' && typeof _libNorm === 'function') {
    libGetAll().then(books => {
      const b = books.find(x => _libNorm(x.title || x.name) === _libNorm(title));
      if (b && b.data) {
        pdf.startPage = b.lastPage || 1;
        return loadPdfFile(new File([b.data], b.name || 'livre.pdf', { type: 'application/pdf' }))
          .then(() => { pdf.bookId = b.id; });
      }
    }).catch(() => {});
  }
};

// Cartes « Notes en cours » de l'accueil
function draftsHomeHtml() {
  const drafts = _draftsAll().filter(d => d.snap && d.snap.noteType && d.snap.noteType !== 'sujet');
  if (!drafts.length) return '';
  const typeLabel = { livre: 'Note de livre', chapitre: 'Note de chapitre' };
  return `<div class="home-label">${icon('history_edu', 14)} NOTES EN COURS</div>
  <div class="drafts-list">` + drafts.map(d => {
    const s = d.snap;
    const steps = s.noteType === 'chapitre' ? STEPS_CHAPITRE : STEPS_LIVRE;
    const stepTitle = (steps[Math.min(s.step || 0, steps.length - 1)] || {}).title || '';
    const title = (s.noteType === 'chapitre' ? (s.chapterTitle || s.bookTitle) : s.bookTitle) || 'Note sans titre';
    const dt = new Date(d.savedAt);
    const when = dt.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' · ' + dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    return `<div class="draft-card">
      <div class="draft-info">
        <div class="draft-title">${escapeHtml(title)}</div>
        <div class="draft-meta">${typeLabel[s.noteType] || 'Note'} · ${escapeHtml(stepTitle)} · ${when}</div>
      </div>
      <div class="draft-actions">
        <button class="lib-action" onclick="liResumeDraft('${d.id}')">${icon('play_arrow', 15)} Reprendre</button>
        <button class="lib-action draft-del" title="Supprimer ce brouillon" onclick="liDeleteDraft('${d.id}')">${icon('close', 15)}</button>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

function getSteps() {
  if (state.noteType === 'chapitre') return STEPS_CHAPITRE;
  if (state.noteType === 'sujet') return STEPS_SUJET;
  return STEPS_LIVRE;
}
function getPhases() { return state.noteType === 'sujet' ? PHASES_SUJET : PHASES; }
function re() { render(); }
// Icône Material Symbols (fonts.google.com/icons) — helper global pour tous les modules
window.icon = function(name, size) { return `<span class="ms"${size ? ` style="font-size:${size}px"` : ''}>${name}</span>`; };
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
function escapeAttr(s) { return (s||'').replace(/"/g,'&quot;'); }
function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============= VOICE =============
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let currentRec = null;
let currentMicBtn = null;

function attachMic(wrapEl, targetEl) {
  if (!SpeechRec) return;
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'mic-btn'; btn.title = 'Dictée vocale (fr-FR)'; btn.innerHTML = icon('mic', 15);
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    if (currentRec && currentMicBtn === btn) { currentRec.stop(); return; }
    if (currentRec) { try { currentRec.stop(); } catch(_){} }
    const rec = new SpeechRec();
    rec.lang = 'fr-FR'; rec.continuous = true; rec.interimResults = true;
    let baseText = targetEl.value;
    if (baseText && !baseText.endsWith(' ') && !baseText.endsWith('\n')) baseText += ' ';
    rec.onresult = (ev) => {
      let finalT = '', interimT = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) finalT += r[0].transcript; else interimT += r[0].transcript;
      }
      if (finalT) baseText += finalT;
      targetEl.value = baseText + interimT;
      targetEl.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onend = () => {
      btn.classList.remove('listening');
      if (currentRec === rec) { currentRec = null; currentMicBtn = null; }
      targetEl.value = baseText.trim();
      targetEl.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onerror = (e) => {
      btn.classList.remove('listening');
      if (e.error === 'not-allowed') showToast('Micro refusé — autorise l\'accès');
      else if (e.error !== 'aborted' && e.error !== 'no-speech') showToast('Erreur micro : ' + e.error);
    };
    currentRec = rec; currentMicBtn = btn;
    btn.classList.add('listening');
    try { rec.start(); } catch(err) { btn.classList.remove('listening'); showToast('Micro indisponible'); }
  });
  wrapEl.appendChild(btn);
}

function wireVoiceOnAll() {
  document.querySelectorAll('.input-wrap').forEach(wrap => {
    if (wrap.dataset.micWired) return;
    const target = wrap.querySelector('input, textarea');
    if (!target) return;
    // Dictée locale hors-ligne (voice.js) en priorité ; repli sur l'ancien
    // moteur Web Speech seulement s'il n'est pas chargé.
    if (window.liVoice && window.liVoice.supported) window.liVoice.attach(wrap, target);
    else attachMic(wrap, target);
    wrap.dataset.micWired = '1';
  });
}

// ============= PDF =============
async function loadPdfFromInput(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  await loadPdfFile(file);
  // reset l'input pour pouvoir recharger le même fichier après
  e.target.value = '';
}

// Garde-fou : beaucoup de PDF mettent le nom du logiciel dans Title/Author
// (Microsoft Word, Acrobat, LaTeX…) — on n'auto-remplit que si ça ressemble
// à un vrai titre/nom.
function _looksLikeMeta(v) {
  if (!v || v.length < 2 || v.length > 90) return false;
  // Métadonnées corrompues : caractères de contrôle (C0/C1) ou caractère de
  // remplacement Unicode (U+FFFD) = mauvais décodage → gibberish dans l'encart.
  if (/[\u0000-\u001F\u007F-\u009F\uFFFD]/.test(v)) return false;
  // Doit contenir au moins une lettre (rejette « <8=8AB@0B>@ » et compagnie).
  if (!/\p{L}/u.test(v)) return false;
  if (/^(untitled|microsoft|word|acrobat|pscript|pdftex|latex|xetex|calibre|writer|ghostscript|quartz|indesign|distiller|powerpoint|libreoffice|openoffice|unknown|anonymous|anonyme|none|null|n\/?a|admin|user|owner|author|auteur|default|document\d*)\b/i.test(v)) return false;
  if (/\.(pdf|docx?|indd|tex)$/i.test(v)) return false;
  return true;
}

// Texte des premières pages (page de titre) pour retrouver l'auteur
async function _firstPagesText(maxPages, maxChars) {
  maxPages = maxPages || 3; maxChars = maxChars || 2200;
  let out = '';
  try {
    for (let i = 1; i <= Math.min(maxPages, pdf.total || 1); i++) {
      const page = await pdf.doc.getPage(i);
      const tc = await page.getTextContent();
      out += tc.items.map(it => it.str).join(' ') + '\n';
      if (out.length > maxChars) break;
    }
  } catch (_) {}
  return out.replace(/\s+/g, ' ').trim().slice(0, maxChars);
}

// Repli sans IA : motif « par / by <Nom Prénom> » sur la page de titre
function _authorFromText(text) {
  const m = (text || '').match(/\b(?:par|by)\s+([A-ZÀ-Þ][\p{L}'’.-]+(?:\s+[A-ZÀ-Þ][\p{L}'’.-]+){1,2})/u);
  return m ? m[1].trim() : '';
}

// L'IA (Qwen/LM Studio, GPT-4.1 nano, Claude…) identifie l'auteur depuis la page de titre
async function _aiFindAuthor(title, firstText) {
  if (!window.aiIsConfigured || !window.aiIsConfigured() || !window.aiCall) return '';
  try {
    const r = await window.aiCall({
      system: 'Tu identifies l\'auteur d\'un livre à partir de sa page de titre. Ne devine jamais : si l\'auteur n\'apparaît pas clairement, renvoie une chaîne vide.',
      user: `Titre supposé : "${title || '(inconnu)'}"\n\nDébut du livre (page de titre) :\n"""${firstText}"""\n\nDonne uniquement le nom complet de l'auteur (une personne). Si tu n'es pas sûr, renvoie "".`,
      schema: { type: 'object', properties: { author: { type: 'string' } }, required: ['author'], additionalProperties: false },
      model: window.aiCheapestModel ? window.aiCheapestModel() : undefined,
      maxTokens: 60
    });
    return (r && typeof r.author === 'string') ? r.author.trim() : '';
  } catch (_) { return ''; }
}

// Détection d'auteur en tâche de fond : IA d'abord, repli texte, sinon rien
async function _detectAuthorAsync(title) {
  try {
    const text = await _firstPagesText();
    if (!text) return;
    let author = await _aiFindAuthor(title, text);
    if (!author) author = _authorFromText(text);
    author = (author || '').trim();
    // On n'écrase pas une saisie de l'utilisateur (suivi auto coupé) ni le bruit
    if (author && _looksLikeMeta(author) && !/^\d/.test(author) && state._authorAuto && !state.bookAuthor) {
      state.bookAuthor = author;
      showToast('Auteur détecté : ' + author);
      if (typeof re === 'function') re();
    }
  } catch (_) {}
}

async function loadPdfFile(file) {
  if (!window.pdfjsLib) { showToast('PDF.js non chargé'); return; }
  // Nouveau document : libérer l'ancien PDF.js (mémoire/worker) et couper le
  // rattachement bibliothèque tant qu'il n'est pas recalculé — sinon un scroll
  // pendant le chargement écrit la position du nouveau livre dans la fiche de
  // l'ancien (pdf.bookId encore périmé).
  const oldDoc = pdf.doc;
  pdf.doc = null;
  pdf.bookId = null;
  if (oldDoc) { try { oldDoc.destroy(); } catch (_) {} }
  // Un lecteur EPUB encore ouvert occupe le même panneau → le fermer proprement
  if (window.closeEpubReader && document.querySelector('.epub-reader-panel')) window.closeEpubReader();
  const buf = await file.arrayBuffer();
  try {
    pdf.doc = await pdfjsLib.getDocument({ data: buf }).promise;
    pdf.total = pdf.doc.numPages;
    // Si une page de reprise a été demandée (depuis la lib), l'utiliser
    pdf.page = (pdf.startPage && pdf.startPage <= pdf.total) ? pdf.startPage : 1;
    pdf.startPage = null;
    pdf.name = file.name;
    state.pdfPanelOpen = true;

    // 🎯 Auto-fill titre + auteur depuis les métadonnées du PDF
    let metaTitle = '', metaAuthor = '';
    try {
      const md = await pdf.doc.getMetadata();
      const info = (md && md.info) || {};
      metaTitle = (info.Title || '').trim();
      metaAuthor = (info.Author || '').trim();
    } catch (_) {}

    const cleanName = file.name
      .replace(/\.pdf$/i, '')
      .replace(/[_-]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    // Titre PROPRE À CE FICHIER, toujours calculé : c'est lui que la
    // bibliothèque utilise pour rattacher le livre (jamais le titre de la
    // session, qui peut appartenir à un autre livre ouvert avant).
    pdf.fileTitle = _looksLikeMeta(metaTitle) ? metaTitle : cleanName;
    // Le TITRE suit le PDF visionné tant que l'utilisateur ne l'a pas saisi à la
    // main (state._titleAuto). Ouvrir un autre PDF met donc à jour le titre.
    if (state._titleAuto && pdf.fileTitle && pdf.fileTitle !== state.bookTitle) {
      state.bookTitle = pdf.fileTitle;
      const ti = document.getElementById('book-title');
      if (ti && document.activeElement !== ti) ti.value = state.bookTitle;
      showToast('Titre détecté : ' + state.bookTitle);
    }
    // L'AUTEUR suit aussi le PDF visionné : métadonnées de CE fichier, sinon
    // détection en tâche de fond (page de titre + IA), sans écraser une saisie.
    if (state._authorAuto) {
      const ai = document.getElementById('book-author');
      if (_looksLikeMeta(metaAuthor)) {
        if (metaAuthor !== state.bookAuthor) {
          state.bookAuthor = metaAuthor;
          if (ai && document.activeElement !== ai) ai.value = state.bookAuthor;
          showToast('Auteur détecté : ' + metaAuthor);
        }
      } else {
        // Nouveau PDF sans auteur en métadonnées → repart de zéro puis détecte
        state.bookAuthor = '';
        if (ai && document.activeElement !== ai) ai.value = '';
        _detectAuthorAsync(pdf.fileTitle);
      }
    }

    // Note de chapitre : remplit le chapitre depuis le sommaire du PDF
    syncChapterFromPdf();

    renderPdfPanel();
    await renderAllPages();
    // Si reprise demandée, scroller vers la page après le rendu initial
    if (pdf.page > 1) {
      setTimeout(() => scrollToPage(pdf.page), 100);
    }
    syncPdfPanel();
    re();
  } catch (err) {
    showToast('Erreur lors du chargement du PDF');
    console.error(err);
  }
}

// =============================================================
// Défilement continu virtualisé
// =============================================================
let _pdfObserver = null;
const _renderedPages = new Set();

// Échelle qui fait tenir la page dans la largeur du panneau (PDF responsive).
async function _pdfFitScale() {
  const viewer = document.getElementById('pdf-viewer');
  if (!viewer || !pdf.doc) return pdf.scale;
  const page = await pdf.doc.getPage(pdf.page || 1);
  const natural = page.getViewport({ scale: 1 });
  const avail = viewer.clientWidth - 26; // padding 12px de chaque côté + marge
  if (avail < 60) return pdf.scale;
  return Math.max(0.4, Math.min(3, avail / natural.width));
}

// Re-ajuste le PDF quand le panneau ou la fenêtre change de largeur.
let _pdfRO = null, _pdfROTimer = null, _pdfLastW = 0, _pdfRendering = false;
function _observePdfResize() {
  const viewer = document.getElementById('pdf-viewer');
  if (!viewer || _pdfRO || !window.ResizeObserver) return;
  _pdfLastW = viewer.clientWidth;
  _pdfRO = new ResizeObserver(() => {
    if (!pdf.doc || !pdf.fit || _pdfRendering) return; // pas pendant notre propre rendu
    const w = viewer.clientWidth;
    if (Math.abs(w - _pdfLastW) < 8) return; // ignore les micro-variations
    _pdfLastW = w;
    clearTimeout(_pdfROTimer);
    _pdfROTimer = setTimeout(async () => {
      const wasPage = pdf.page;
      await renderAllPages();
      setTimeout(() => scrollToPage(wasPage), 80);
    }, 180);
  });
  _pdfRO.observe(viewer);
}

async function renderAllPages() {
  if (!pdf.doc) return;
  _pdfRendering = true; // gèle le ResizeObserver pendant qu'on remanie le DOM
  const viewer = document.getElementById('pdf-viewer');
  viewer.innerHTML = '';
  _renderedPages.clear();
  if (_pdfObserver) { _pdfObserver.disconnect(); _pdfObserver = null; }

  // PDF responsive : par défaut, la page s'ajuste à la largeur du panneau
  if (pdf.fit) { try { pdf.scale = await _pdfFitScale(); } catch (_) {} }
  _observePdfResize();

  // Dimensions de la page 1 pour estimer
  const firstPage = await pdf.doc.getPage(1);
  const firstViewport = firstPage.getViewport({ scale: pdf.scale });

  // Créer un slot vide par page
  for (let i = 1; i <= pdf.total; i++) {
    const slot = document.createElement('div');
    slot.className = 'pdf-page-slot';
    slot.dataset.page = i;
    slot.dataset.pageLabel = `Page ${i}`;
    slot.style.width = firstViewport.width + 'px';
    slot.style.height = firstViewport.height + 'px';
    slot.textContent = i;
    viewer.appendChild(slot);
  }

  // IntersectionObserver : ne rendre que les pages visibles ± 1
  _pdfObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const pageNum = parseInt(entry.target.dataset.page);
      if (entry.isIntersecting && !_renderedPages.has(pageNum)) {
        _renderedPages.add(pageNum);
        renderPageInSlot(pageNum, entry.target);
      }
    });
  }, { root: viewer, rootMargin: '800px' });

  viewer.querySelectorAll('.pdf-page-slot').forEach(s => _pdfObserver.observe(s));

  // Suivi de la page courante au scroll — posé une seule fois : renderAllPages
  // est rappelée à chaque zoom/fit/changement de doc et empilait les listeners.
  if (!viewer.dataset.scrollWired) {
    viewer.dataset.scrollWired = '1';
    let scrollTimer = null;
    viewer.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(_updateCurrentPageFromScroll, 80);
    });
  }

  // UI mise à jour
  document.getElementById('pdf-pagenum').textContent = `${pdf.page} / ${pdf.total}`;
  document.getElementById('pdf-filename').textContent = pdf.name;
  document.getElementById('pdf-prev').disabled = false;
  document.getElementById('pdf-next').disabled = false;
  document.getElementById('pdf-zoom-in').disabled = false;
  document.getElementById('pdf-zoom-out').disabled = false;
  document.getElementById('pdf-highlight').disabled = false;

  // Largeur de référence figée sur l'état final (barre de défilement réservée) :
  // les prochains vrais redimensionnements sont détectés, pas notre propre rendu.
  _pdfLastW = viewer.clientWidth;
  // Libère le ResizeObserver au tick suivant (après reflow), pour ne pas
  // réagir aux mutations qu'on vient de faire.
  requestAnimationFrame(() => { _pdfRendering = false; });
}

async function renderPageInSlot(pageNum, slot) {
  try {
    const page = await pdf.doc.getPage(pageNum);
    const viewport = page.getViewport({ scale: pdf.scale });
    slot.style.width = viewport.width + 'px';
    slot.style.height = viewport.height + 'px';
    slot.textContent = '';
    slot.style.color = '';

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.display = 'block';
    slot.appendChild(canvas);

    const textLayer = document.createElement('div');
    textLayer.className = 'textLayer';
    textLayer.style.width = viewport.width + 'px';
    textLayer.style.height = viewport.height + 'px';
    // PDF.js positionne les mots via calc(var(--scale-factor) * …) : sans cette
    // variable, le calque de texte (sélectionnable) est décalé de l'image et le
    // double-clic sélectionne à côté. On la fixe à l'échelle du viewport.
    textLayer.style.setProperty('--scale-factor', viewport.scale);
    slot.appendChild(textLayer);

    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const textContent = await page.getTextContent();
    pdfjsLib.renderTextLayer({ textContentSource: textContent, container: textLayer, viewport, textDivs: [] });
  } catch (err) {
    console.warn('renderPageInSlot error', pageNum, err);
  }
}

function _updateCurrentPageFromScroll() {
  const viewer = document.getElementById('pdf-viewer');
  if (!viewer) return;
  const viewportCenter = viewer.scrollTop + viewer.clientHeight / 2;
  let bestPage = pdf.page, bestDist = Infinity;
  viewer.querySelectorAll('.pdf-page-slot').forEach(slot => {
    const center = slot.offsetTop + slot.offsetHeight / 2;
    const dist = Math.abs(center - viewportCenter);
    if (dist < bestDist) { bestDist = dist; bestPage = parseInt(slot.dataset.page); }
  });
  if (bestPage !== pdf.page) {
    pdf.page = bestPage;
    const el = document.getElementById('pdf-pagenum');
    if (el) el.textContent = `${pdf.page} / ${pdf.total}`;
    if (window.libSetLastPosition && pdf.bookId) {
      window.libSetLastPosition(pdf.bookId, pdf.page, pdf.total);
    }
    if (window.dashboardTrackPage) window.dashboardTrackPage(pdf.bookId, pdf.page);
    // Note de chapitre : le chapitre suit la page courante (si suivi auto)
    syncChapterFromPdf();
  }
}

function scrollToPage(pageNum) {
  const viewer = document.getElementById('pdf-viewer');
  if (!viewer) return;
  const slot = viewer.querySelector(`.pdf-page-slot[data-page="${pageNum}"]`);
  if (slot) {
    pdf.page = pageNum;
    viewer.scrollTo({ top: slot.offsetTop - 10, behavior: 'smooth' });
    const el = document.getElementById('pdf-pagenum');
    if (el) el.textContent = `${pdf.page} / ${pdf.total}`;
  }
}

// Relie le chapitre de la note au chapitre courant du PDF (sommaire/outline).
// N'agit qu'en mode « note de chapitre » et tant que l'utilisateur n'a pas
// saisi le chapitre à la main (state._chapterAuto). force=true réactive le suivi.
async function syncChapterFromPdf(force) {
  if (!window.pdf || !pdf.doc) return;
  if (state.noteType !== 'chapitre') return;
  if (!force && !state._chapterAuto) return;
  let ch = null;
  try { if (window.getCurrentChapterFromPdf) ch = await window.getCurrentChapterFromPdf(); } catch (_) {}
  if (!ch || ch === state.chapterTitle) return;
  state.chapterTitle = ch;
  state._chapterAuto = true;
  const inp = document.getElementById('chapter-title');
  if (inp && document.activeElement !== inp) inp.value = ch; // ne pas écraser pendant la frappe
  try { persistState(); } catch (_) {}
}
window.syncChapterFromPdf = syncChapterFromPdf;

// Backward compat
async function renderPage() { return renderAllPages(); }

let _methodExpanded = false;
// Écran séparé PDF | méthode (sinon : PDF plein cadre + méthode en dock)
let _pdfSplit = localStorage.getItem('li-pdf-split') === '1';
function renderPdfPanel() {
  const panel = document.getElementById('pdf-panel');
  const layout = document.querySelector('.layout');
  panel.classList.toggle('active', state.pdfPanelOpen);
  // Mode lecture : PDF plein cadre + dock, ou côte à côte si écran séparé
  if (layout) {
    layout.classList.toggle('pdf-mode', state.pdfPanelOpen && !_pdfSplit);
    if (!state.pdfPanelOpen) _methodExpanded = false;
    layout.classList.toggle('method-open', state.pdfPanelOpen && !_pdfSplit && _methodExpanded);
  }
  const sb = document.getElementById('pdf-split');
  if (sb) sb.classList.toggle('active', _pdfSplit);
  if (!state.pdfPanelOpen && panel.classList.contains('fullscreen')) setPdfFullscreen(false);
  if (state.pdfPanelOpen && !pdf.doc) renderPdfEmptyLibrary();

}
function setPdfSplit(on) {
  _pdfSplit = !!on;
  localStorage.setItem('li-pdf-split', _pdfSplit ? '1' : '0');
  if (_pdfSplit) {
    _methodExpanded = false;
    const panel = document.getElementById('pdf-panel');
    if (panel && panel.classList.contains('fullscreen')) setPdfFullscreen(false);
  }
  renderPdfPanel();
}
window.setPdfSplit = setPdfSplit;
function setMethodExpanded(on) {
  _methodExpanded = !!on;
  const layout = document.querySelector('.layout');
  if (layout) layout.classList.toggle('method-open', state.pdfPanelOpen && _methodExpanded);
  updateMethodDock();

}
function updateMethodDock() {
  const label = document.getElementById('method-dock-label');
  if (!label) return;
  let t = 'Ma méthode';
  try {
    const STEPS = getSteps();
    const s = STEPS[state.step];
    if (state.done) t = 'Fiche terminée';
    else if (s && s.title) t = s.title;
  } catch (_) {}
  label.textContent = t;
}

// Panneau PDF vide : proposer les livres de la bibliothèque (les mêmes
// que sur l'accueil et le tableau de bord), avec reprise à la dernière page
async function renderPdfEmptyLibrary() {
  const empty = document.querySelector('#pdf-viewer .pdf-empty');
  if (!empty || pdf.doc || typeof libGetAll !== 'function') return;
  let books = [];
  try { books = await libGetAll(); } catch (_) { return; }
  if (window.libDedupe) books = window.libDedupe(books); // un livre = une seule entrée
  if (!books.length || pdf.doc) return;
  books.sort((a, b) => (b.lastViewedAt || b.addedAt || 0) - (a.lastViewedAt || a.addedAt || 0));
  let list = empty.querySelector('.pdf-empty-books');
  if (!list) { list = document.createElement('div'); list.className = 'pdf-empty-books'; empty.appendChild(list); }
  list.innerHTML = `<h5>Ma bibliothèque</h5>` + books.slice(0, 12).map(b => {
    const pct = (b.lastPage && b.totalPages) ? Math.min(100, Math.round((b.lastPage / b.totalPages) * 100)) : 0;
    return `<button class="pdf-empty-book" data-book="${b.id}">
      <span class="ms" style="font-size:16px">picture_as_pdf</span>
      <span class="pdf-empty-book-main">
        <span class="pdf-empty-book-title">${escapeHtml(b.title || b.name)}</span>
        <span class="pdf-empty-book-sub">${b.lastPage > 1 ? `page ${b.lastPage}${b.totalPages ? ' / ' + b.totalPages + ' · ' + pct + '%' : ''}` : 'pas encore commencé'}</span>
      </span>
      <span class="ms" style="font-size:16px;color:var(--accent)">play_arrow</span>
    </button>`;
  }).join('');
  list.querySelectorAll('[data-book]').forEach(btn => {
    btn.onclick = async () => {
      try {
        const book = await libGet(parseInt(btn.dataset.book));
        if (!book) return;
        const file = new File([book.data], book.name, { type: 'application/pdf' });
        if (book.lastPage) pdf.startPage = book.lastPage;
        await window.loadPdfFile(file);
        pdf.bookId = book.id;
        if (book.lastPage > 1) showToast(`Reprise à la page ${book.lastPage}`);
      } catch (e) { showToast('Impossible d\'ouvrir ce livre'); }
    };
  });
}
window.renderPdfEmptyLibrary = renderPdfEmptyLibrary;

function captureHighlight() {
  const sel = window.getSelection();
  const txt = sel ? sel.toString().trim() : '';
  if (!txt) { showToast('Sélectionne d\'abord du texte dans le PDF'); return; }
  const page = pdf.page;
  // src : document d'origine de la citation — si on change de PDF en cours de
  // session, les citations de l'ancien restent identifiables (liste + export).
  state.highlights.push({ page, text: txt, ts: Date.now(), src: pdf.fileTitle || state.bookTitle || '' });
  if (sel.removeAllRanges) sel.removeAllRanges();
  showToast('Citation archivée ✓');
  if (window.dashboardTrackCitation) window.dashboardTrackCitation();
  renderHighlightsBar();
  // Mettre à jour le panneau live si on est sur l'écran Pomodoro
  if (document.getElementById('citations-live')) {
    refreshCitationsLive();
  }
  // Mettre à jour la sidebar permanente
  if (window.refreshCitationsSidebar) window.refreshCitationsSidebar();
  // Export Anki de la citation (si Anki est ouvert) : « Que dit [source] sur [sujet] ? »
  _citationToAnki(txt, page);
}

// Envoie une citation surlignée dans Anki (sous-paquet du livre).
// Le chapitre est détecté automatiquement depuis le sommaire du PDF.
async function _citationToAnki(text, page) {
  if (!window.ankiAddCitation) return;
  const source = state.bookAuthor || state.bookTitle || 'ce texte';
  const subject = (state.noteType === 'sujet' ? state.sujet.sujet : '') || state.ppu.precis || state.chapterTitle || '';
  const deck = state.bookTitle || (state.noteType === 'sujet' ? state.sujet.sujet : '') || state.chapterTitle || 'Citations';
  let chapter = state.chapterTitle || '';
  try { if (window.getCurrentChapterFromPdf) chapter = (await window.getCurrentChapterFromPdf()) || chapter; } catch (_) {}
  const ok = await window.ankiAddCitation({
    text, page, source, subject, deck,
    book: state.bookTitle, author: state.bookAuthor, chapter
  });
  if (ok) showToast('Citation archivée + carte Anki ✓');
}

function refreshCitationsLive() {
  const list = document.querySelector('.citations-live-list');
  const count = document.querySelector('.citations-count');
  if (!list) return;
  if (count) count.textContent = state.highlights.length;
  if (state.highlights.length === 0) {
    list.innerHTML = `<div class="citations-empty">Aucune citation pour l'instant — surligne ton premier passage à gauche !</div>`;
    return;
  }
  list.innerHTML = state.highlights.slice().reverse().map((h, i) => {
    const realIdx = state.highlights.length - 1 - i;
    const fromOther = h.src && h.src !== (pdf.fileTitle || state.bookTitle);
    return `<div class="citation-card">
      <div class="citation-meta">Page ${h.page} · ${new Date(h.ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}${fromOther ? ` · ${escapeHtml(h.src)}` : ''}</div>
      <blockquote>${escapeHtml(h.text)}</blockquote>
      <button class="citation-del" data-idx="${realIdx}" title="Supprimer cette citation">✕</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.citation-del').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);
      state.highlights.splice(idx, 1);
      refreshCitationsLive();
      renderHighlightsBar();
    };
  });
  // Auto-scroll vers le haut (la citation la plus récente)
  list.scrollTop = 0;
}

function wirePdfControls() {
  const bp = document.getElementById('pdf-prev');
  if (bp) bp.onclick = () => { if (pdf.page > 1) scrollToPage(pdf.page - 1); };
  const bn = document.getElementById('pdf-next');
  if (bn) bn.onclick = () => { if (pdf.page < pdf.total) scrollToPage(pdf.page + 1); };
  const zi = document.getElementById('pdf-zoom-in');
  if (zi) zi.onclick = async () => {
    pdf.fit = false; // zoom manuel : on quitte l'ajustement auto
    pdf.scale = Math.min(3, pdf.scale + 0.2);
    const wasPage = pdf.page;
    await renderAllPages();
    setTimeout(() => scrollToPage(wasPage), 100);
  };
  const zo = document.getElementById('pdf-zoom-out');
  if (zo) zo.onclick = async () => {
    pdf.fit = false;
    pdf.scale = Math.max(0.4, pdf.scale - 0.2);
    const wasPage = pdf.page;
    await renderAllPages();
    setTimeout(() => scrollToPage(wasPage), 100);
  };
  // Bouton « ajuster à la largeur » : réactive le mode responsive
  const zf = document.getElementById('pdf-fit');
  if (zf) zf.onclick = async () => {
    pdf.fit = true;
    const wasPage = pdf.page;
    await renderAllPages();
    setTimeout(() => scrollToPage(wasPage), 100);
  };
  const hl = document.getElementById('pdf-highlight');
  if (hl) hl.onclick = captureHighlight;
  const fsBtn = document.getElementById('pdf-fullscreen');
  if (fsBtn) fsBtn.onclick = () => setPdfFullscreen(!document.getElementById('pdf-panel').classList.contains('fullscreen'));
}

// Bascule le lecteur PDF en plein écran (couvre toute la fenêtre) et inversement
function setPdfFullscreen(on) {
  const panel = document.getElementById('pdf-panel');
  if (!panel) return;
  // Ouvrir le panneau si besoin avant de passer en plein écran
  if (on && !state.pdfPanelOpen) { state.pdfPanelOpen = true; renderPdfPanel(); syncPdfPanel(); }
  panel.classList.toggle('fullscreen', on);
  const fsBtn = document.getElementById('pdf-fullscreen');
  if (fsBtn) {
    fsBtn.querySelector('.ms').textContent = on ? 'fullscreen_exit' : 'fullscreen';
    fsBtn.title = on ? 'Quitter le plein écran' : 'Plein écran';
    fsBtn.classList.toggle('active', on);
  }
}

// Échap : replie d'abord la méthode, sinon quitte le plein écran PDF
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const layout = document.querySelector('.layout');
  if (layout && layout.classList.contains('method-open')) {
    e.preventDefault();
    setMethodExpanded(false);
  } else if (document.getElementById('pdf-panel')?.classList.contains('fullscreen')) {
    e.preventDefault();
    setPdfFullscreen(false);
  }
});

// Plein écran de tout le site (API Fullscreen du navigateur : masque aussi
// la barre du navigateur). Doit être déclenché par un vrai clic utilisateur.
function toggleAppFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    const p = req && req.call(el);
    if (p && p.catch) p.catch(() => { if (window.showToast) showToast('Plein écran refusé par le navigateur'); });
  }
}
function _syncFsIcon() {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.querySelectorAll('#btn-fs .ms').forEach(s => { s.textContent = on ? 'fullscreen_exit' : 'fullscreen'; });
  document.querySelectorAll('#btn-fs').forEach(b => { b.classList.toggle('active', on); b.title = on ? 'Quitter le plein écran' : 'Plein écran (tout le site)'; });
}
document.addEventListener('fullscreenchange', _syncFsIcon);
document.addEventListener('webkitfullscreenchange', _syncFsIcon);

// Popup automatique au-dessus de la sélection PDF
let hlPopup = null;
function ensureHlPopup() {
  if (hlPopup) return hlPopup;
  hlPopup = document.createElement('div');
  hlPopup.className = 'hl-popup';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.innerHTML = icon('ink_highlighter', 15) + ' Enregistrer le surlignage';
  // mousedown: empêcher la perte de focus/sélection avant le click
  btn.addEventListener('mousedown', (e) => e.preventDefault());
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    captureHighlight();
    hideHlPopup();
  });
  hlPopup.appendChild(btn);
  document.body.appendChild(hlPopup);
  return hlPopup;
}
function hideHlPopup() { if (hlPopup) hlPopup.style.display = 'none'; }

document.addEventListener('mouseup', () => {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) { hideHlPopup(); return; }
    const range = sel.getRangeAt(0);
    const node = range.commonAncestorContainer;
    const el = node.nodeType === 1 ? node : node.parentElement;
    if (!el || !el.closest('.textLayer')) { hideHlPopup(); return; }
    const rect = range.getBoundingClientRect();
    if (!rect.width || !rect.height) { hideHlPopup(); return; }
    const pop = ensureHlPopup();
    pop.style.display = 'block';
    // Positionner au-dessus de la sélection, centré
    const popW = pop.offsetWidth;
    const popH = pop.offsetHeight;
    let left = rect.left + window.scrollX + rect.width / 2 - popW / 2;
    let top = rect.top + window.scrollY - popH - 10;
    // Si trop haut (hors viewport), passer en-dessous
    if (top < window.scrollY + 4) {
      top = rect.bottom + window.scrollY + 10;
      pop.classList.add('below');
    } else {
      pop.classList.remove('below');
    }
    // Borner horizontalement
    left = Math.max(4, Math.min(window.innerWidth - popW - 4, left));
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }, 10);
});

document.addEventListener('mousedown', (e) => {
  if (hlPopup && !hlPopup.contains(e.target)) hideHlPopup();
});
window.addEventListener('scroll', hideHlPopup, true);

// Resizer
(function setupResizer() {
  const resizer = document.getElementById('resizer');
  const panel = document.getElementById('pdf-panel');
  let dragging = false;
  resizer.style.touchAction = 'none';
  resizer.addEventListener('pointerdown', (e) => {
    dragging = true; document.body.style.cursor = 'col-resize';
    resizer.setPointerCapture && resizer.setPointerCapture(e.pointerId);
  });
  window.addEventListener('pointermove', (e) => {
    if (!dragging || !panel.classList.contains('active')) return;
    const w = Math.max(280, Math.min(window.innerWidth * 0.75, e.clientX));
    panel.style.flex = `0 0 ${w}px`;
  });
  window.addEventListener('pointerup', () => { dragging = false; document.body.style.cursor = ''; });
})();

function wikilink(s) {
  if (!s) return '—';
  return `[[${String(s).replace(/[\[\]]/g, '').trim()}]]`;
}

function generateMarkdownSujet() {
  const date = new Date().toLocaleDateString('fr-FR', { year:'numeric', month:'long', day:'numeric' });
  const su = state.sujet;
  let md = `# Maîtriser un sujet — ${wikilink(su.sujet)}\n\n`;
  md += `> Méthode d'apprentissage (Oussama Ammar) — session du ${date}\n\n---\n\n`;
  md += `## Phase 1 — Cadrage (YouTube + cartographie)\n\n`;
  md += `**Notes de visionnage**\n\n${su.videos || '—'}\n\n`;
  md += `**Concepts à creuser**\n\n${su.carto ? su.carto.split('\n').map(x => x.trim()).filter(Boolean).map(c => `- ${wikilink(c)}`).join('\n') : '—'}\n\n`;
  if (su.cartoLien) md += `**Carte Miro** : ${su.cartoLien}\n\n`;
  if ((su.ytVideos || []).length) {
    md += `**Vidéos recommandées**\n\n`;
    su.ytVideos.forEach(v => {
      md += `- ${v.titre}${v.videoId ? ` — [regarder](https://www.youtube.com/watch?v=${v.videoId})` : ` — [chercher sur YouTube](https://www.youtube.com/results?search_query=${encodeURIComponent(v.requete)})`}\n`;
      if (v.notes && v.notes.trim()) md += `  - Mes notes : ${v.notes.trim().replace(/\n+/g, ' ')}\n`;
    });
    md += `\n`;
  }
  md += `## Phase 2 — Profondeur\n\n`;
  md += `**Livres de référence (à demi lire, en diagonale)**\n\n${su.livres || '—'}\n\n`;
  if ((su.livresSugg || []).length) {
    md += `**Dossier livres du domaine (suggestions)**\n\n`;
    su.livresSugg.forEach(l => { md += `- ${l.titre} — ${l.auteur} (${l.raison})\n`; });
    md += `\n`;
  }
  const qs = su.questions || [];
  md += `**Crash-test** : ${sujetAnsweredCount(su)} / ${qs.length || 50} questions traitées\n\n`;
  if (qs.length) {
    md += `### Questions du recruteur exigeant et mes avis\n\n`;
    qs.forEach((q, i) => {
      md += `**${i + 1}. ${q.q}**\n\n`;
      (q.avis || []).forEach(a => {
        md += `- *${new Date(a.ts).toLocaleString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })}* — ${a.text.replace(/\n+/g, ' ')}\n`;
      });
      md += `\n`;
    });
  }
  return md;
}

function generateMarkdown() {
  if (state.noteType === 'sujet') return generateMarkdownSujet();
  const date = new Date().toLocaleDateString('fr-FR', { year:'numeric', month:'long', day:'numeric' });
  const synItems = state.synthese.filter(s => s.trim()).map((s, i) => `${i+1}. ${s}`).join('\n');
  const isChapter = state.noteType === 'chapitre';

  let md = `# ${isChapter ? 'Note de chapitre' : 'Note de livre'} — Lecture Intelligente\n\n`;
  md += `> Session du ${date}\n\n`;
  if (state.bookTitle) md += `**Livre** : ${wikilink(state.bookTitle)}\n`;
  if (state.bookAuthor) md += `**Auteur** : ${wikilink(state.bookAuthor)}\n`;
  if (isChapter && state.chapterTitle) md += `**Chapitre** : ${wikilink(state.chapterTitle)}\n`;
  md += `\n---\n\n`;

  md += `## Objectif${isChapter ? ' du chapitre' : ' PPU'}\n\n`;
  md += `- **Personnel** : ${state.ppu.perso || '—'}\n`;
  md += `- **Précis** : ${state.ppu.precis || '—'}\n`;
  md += `- **Utile** : ${state.ppu.utile || '—'}\n\n`;

  if (!isChapter) {
    md += `## Chapitres prioritaires\n\n`;
    md += `${state.tdm.chapitres || '—'}\n\n`;
    if (state.tdm.ordre) md += `**Ordre d'attaque** : ${state.tdm.ordre}\n\n`;
  }

  md += `## Question de lecture\n\n`;
  md += `${state.lecture.question || '—'}\n\n`;

  md += `## Synthèse\n\n`;
  md += synItems ? `${synItems}\n\n` : '—\n\n';

  md += `## Plan d'action\n\n`;
  md += `- **Conseil à tester** : ${state.action.conseil || '—'}\n`;
  md += `- **Quand** : ${state.action.quand || '—'}\n`;
  md += `- **Deadline bilan** : ${state.action.deadline || '—'}\n\n`;

  // 📜 Citations archivées (à la toute fin)
  if (state.highlights.length > 0) {
    md += `---\n\n`;
    md += `## 📜 Citations (${state.highlights.length})\n\n`;
    md += `*Passages surlignés pendant la lecture, archivés automatiquement.*\n\n`;
    state.highlights.forEach((h, i) => {
      const fromOther = h.src && h.src !== state.bookTitle;
      md += `### ${i + 1}. Page ${h.page}${fromOther ? ` — ${h.src}` : ''}\n\n`;
      md += `> ${h.text.replace(/\n+/g, '\n> ')}\n\n`;
    });
  }

  return md;
}

function defaultFilename() {
  const date = new Date().toISOString().slice(0, 10);
  const kind = state.noteType === 'chapitre' ? 'chapitre' : (state.noteType === 'sujet' ? 'sujet' : 'livre');
  const base = state.noteType === 'sujet' ? state.sujet.sujet : state.bookTitle;
  const slug = (base || 'lecture').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'lecture';
  return `${kind}-${slug}-${date}.md`;
}

async function saveMarkdownAs() {
  const md = generateMarkdown();
  const filename = defaultFilename();
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(md);
      await writable.close();
      showToast('Fichier enregistré ✓');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      console.warn('showSaveFilePicker failed, falling back', err);
    }
  }
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Téléchargement lancé');
}
