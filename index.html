<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecture Intelligente</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C0603A' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M12 6.5C10.5 5 8 4.5 4 4.8v12.5c4-.3 6.5.2 8 1.7'/><path d='M12 6.5C13.5 5 16 4.5 20 4.8v12.5c-4-.3-6.5.2-8 1.7'/><path d='M12 6.5V19'/></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0&display=block" rel="stylesheet"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#C0603A"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      /* Warm paper palette — d'après le prototype « Lecture Intelligente » */
      --page: linear-gradient(160deg, #ECE2D2 0%, #E4D8C4 100%); /* fond crème de la scène */
      --bg: #FBF8F2;           /* papier — surface principale */
      --bg2: #F3EBDC;          /* carte / champ chaud */
      --bg3: #EADFCB;          /* survol profond / plateau de lecture */
      --text: #2A2520;         /* encre */
      --text2: #6F665A;        /* texte secondaire */
      --text3: #9C8F78;        /* texte tertiaire */
      --border: rgba(120,105,85,0.16);  /* filet chaud */
      --border2: rgba(120,105,85,0.28);
      --border3: rgba(120,105,85,0.42);
      --hover: rgba(120,105,85,0.08);
      --hover-strong: rgba(120,105,85,0.14);
      --accent: #C0603A;       /* corail */
      --accent-hover: #A94F2F;
      --highlight: rgba(244,210,114,0.45);  /* surlignage jaune */
      --success: #5E7B52;
      --warning: #C77A34;
      --danger: #B4402E;
      --shadow-sm: rgba(60,45,30,0.10) 0px 0px 0px 1px;
      --shadow: rgba(60,45,30,0.06) 0px 0px 0px 1px, rgba(60,45,30,0.12) 0px 3px 8px, rgba(60,45,30,0.18) 0px 12px 30px;
      --shadow-lg: rgba(60,45,30,0.06) 0px 0px 0px 1px, rgba(60,45,30,0.14) 0px 8px 20px, rgba(60,45,30,0.24) 0px 24px 55px;
      --radius: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        /* Warm espresso dark — pendant nocturne du thème papier */
        --page: linear-gradient(160deg, #221C16 0%, #17130F 100%);
        --bg: #1E1912;
        --bg2: #271F17;
        --bg3: #342A20;
        --text: rgba(245,238,228,0.90);
        --text2: rgba(245,238,228,0.52);
        --text3: rgba(245,238,228,0.32);
        --border: rgba(245,238,228,0.10);
        --border2: rgba(245,238,228,0.15);
        --border3: rgba(245,238,228,0.24);
        --hover: rgba(245,238,228,0.06);
        --hover-strong: rgba(245,238,228,0.10);
        --accent: #D2764B;
        --accent-hover: #E08C5F;
        --highlight: rgba(244,210,114,0.28);
        --shadow-sm: rgba(0,0,0,0.4) 0px 0px 0px 1px;
        --shadow: rgba(0,0,0,0.4) 0px 0px 0px 1px, rgba(0,0,0,0.45) 0px 3px 8px, rgba(0,0,0,0.55) 0px 12px 30px;
        --shadow-lg: rgba(0,0,0,0.4) 0px 0px 0px 1px, rgba(0,0,0,0.5) 0px 8px 20px, rgba(0,0,0,0.6) 0px 24px 55px;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* Material Symbols — icônes minimalistes (fonts.google.com/icons) */
    .ms { font-family: 'Material Symbols Outlined'; font-weight: 300; font-style: normal; font-size: 18px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; vertical-align: -4px; user-select: none; -webkit-font-smoothing: antialiased; font-variation-settings: 'opsz' 24; }
    body { background: var(--page); background-attachment: fixed; color: var(--text); font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    button, input, textarea, select { font-family: inherit; color: inherit; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--highlight); }
    .layout { display: flex; height: 100vh; height: 100dvh; width: 100%; }
    button, .checklist-item, .type-card { touch-action: manipulation; }
    #pdf-panel { display: none; flex-direction: column; background: var(--bg2); border-right: 0.5px solid var(--border); min-width: 280px; max-width: 75vw; }
    #pdf-panel.active { display: flex; flex: 0 0 50%; }
    .pdf-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 0.5px solid var(--border); background: var(--bg); flex-wrap: wrap; }
    .pdf-toolbar button, .pdf-toolbar label.btn { padding: 6px 10px; border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text); border-radius: var(--radius); font-family: inherit; font-size: 12px; cursor: pointer; }
    .pdf-toolbar button:hover:not(:disabled), .pdf-toolbar label.btn:hover { background: var(--bg3); }
    .pdf-toolbar button:disabled { opacity: .4; cursor: default; }
    .pdf-toolbar button.highlight-btn { background: #F4D272; color: #4A3A15; border-color: #E3BE55; font-weight: 600; }
    .pdf-toolbar button.highlight-btn:hover { background: #EFC85B; opacity: 1; }
    .pdf-toolbar .pdf-info { font-size: 12px; color: var(--text2); margin-left: auto; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pdf-viewer { flex: 1; overflow: auto; background: var(--bg3); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; scroll-behavior: smooth; }
    .pdf-page-slot { position: relative; background: #FBF8F2; box-shadow: 0 6px 20px -8px rgba(60,45,30,.4); display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 12px; border-radius: 4px; }
    .pdf-page-slot::before { content: attr(data-page-label); position: absolute; top: -22px; left: 0; font-size: 10px; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; }
    .pdf-canvas-wrap { position: relative; box-shadow: 0 6px 20px -8px rgba(60,45,30,.4); background: #FBF8F2; border-radius: 4px; }
    .pdf-canvas-wrap canvas { display: block; max-width: 100%; height: auto; }
    .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; opacity: 0.25; line-height: 1.0; }
    .textLayer > span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .textLayer ::selection { background: var(--highlight); }
    .textLayer ::-moz-selection { background: var(--highlight); }
    .pdf-empty { padding: 2rem 1rem; text-align: center; color: var(--text2); font-size: 13px; line-height: 1.6; }
    .pdf-empty label { display: inline-block; margin-top: 1rem; padding: 10px 16px; background: var(--text); color: var(--bg); border-radius: var(--radius); cursor: pointer; font-weight: 500; }
    .pdf-empty-books { margin: 1.6rem auto 0; text-align: left; max-width: 340px; }
    .pdf-empty-books h5 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; font-weight: 500; }
    .pdf-empty-book { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin-bottom: 6px; border: none; background: var(--bg2); border-radius: var(--radius); cursor: pointer; font-family: inherit; text-align: left; box-shadow: inset 0 0 0 1px var(--border); transition: background .1s; color: var(--text2); }
    .pdf-empty-book:hover { background: var(--hover); }
    .pdf-empty-book-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .pdf-empty-book-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pdf-empty-book-sub { font-size: 11.5px; color: var(--text3); }
    .highlights-bar { padding: 8px 12px; border-top: 0.5px solid var(--border); background: var(--bg); font-size: 12px; color: var(--text2); max-height: 140px; overflow-y: auto; }
    .highlights-bar h5 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; font-weight: 500; }
    .hl-item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 0.5px dashed var(--border); }
    .hl-item:last-child { border-bottom: none; }
    .hl-page { flex: 0 0 auto; font-size: 10px; padding: 2px 6px; background: var(--bg2); border-radius: 4px; margin-top: 2px; }
    .hl-text { flex: 1; line-height: 1.4; font-size: 12px; }
    .hl-del { flex: 0 0 auto; background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 14px; padding: 0 4px; }
    .hl-del:hover { color: var(--accent); }
    .hl-popup { position: absolute; z-index: 200; background: var(--text); color: var(--bg); padding: 0; border-radius: var(--radius); font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); display: none; animation: hlFadeIn .15s ease; }
    .hl-popup button { background: transparent; color: var(--bg); border: none; font-family: inherit; font-size: 13px; cursor: pointer; padding: 8px 14px; display: flex; align-items: center; gap: 6px; font-weight: 500; border-radius: var(--radius); }
    .hl-popup button:hover { background: rgba(255,255,255,.1); }
    .hl-popup::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--text); }
    @keyframes hlFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    #resizer { width: 6px; cursor: col-resize; background: var(--border); flex-shrink: 0; }
    #resizer:hover { background: var(--border2); }
    .main-scroll { flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 2rem 1rem 4rem; }
    .app { width: 100%; max-width: 620px; position: relative; }
    .top-bar { position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: .5rem 0; margin: -2rem 0 2rem; z-index: 5; display: flex; justify-content: flex-start; align-items: center; gap: 2px; border-bottom: 1px solid var(--border); }
    .top-bar .app-title { margin-right: auto; }
    .btn-pdf-toggle { padding: 4px 8px; border: none; background: transparent; color: var(--text2); border-radius: var(--radius); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .1s; height: 36px; min-width: 36px; flex-shrink: 0; }
    .btn-pdf-toggle:hover { background: var(--hover); color: var(--text); }
    .btn-pdf-toggle.active { background: var(--hover-strong); color: var(--text); }
    .app-title { font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 19px; font-weight: 500; color: var(--text); display: inline-flex; align-items: center; gap: 8px; }
    .app-logo { color: var(--accent); flex-shrink: 0; }
    .app-title:hover .app-logo { transform-origin: 12px 12px; animation: pulseLogo 1.4s ease-in-out infinite; }
    @keyframes pulseLogo { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .75; } }
    .phase-bar { display: flex; margin-bottom: 1.5rem; gap: 4px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
    .phase-tab { padding: 6px 12px; font-size: 14px; font-weight: 500; text-align: center; color: var(--text3); line-height: 1.3; transition: all .1s; cursor: default; position: relative; margin-bottom: -1px; }
    .phase-tab.active { color: var(--text); border-bottom: 2px solid var(--text); }
    .phase-tab.done { color: var(--text2); }
    .progress-dots { display: flex; gap: 4px; margin-bottom: 2.5rem; flex-wrap: wrap; }
    .dot { width: 24px; height: 3px; border-radius: 2px; background: var(--bg3); transition: all .2s ease; }
    .dot.active { background: var(--text); }
    .dot.done { background: var(--text2); opacity: .5; }
    .step-number { font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: 0; text-transform: none; margin-bottom: .5rem; }
    .step-title { font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 500; line-height: 1.15; margin-bottom: 1.5rem; letter-spacing: -0.01em; color: var(--text); }
    .step-why { font-size: 14px; color: var(--text2); line-height: 1.6; padding: 12px 16px 12px 18px; background: var(--bg2); border-radius: var(--radius); margin-bottom: 1.5rem; border: none; }
    .example-box { background: var(--bg2); border: none; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 1.5rem; font-size: 14px; color: var(--text); line-height: 1.55; box-shadow: inset 0 0 0 1px var(--border); }
    .example-box strong { color: var(--text2); font-weight: 600; font-size: 12px; display: block; margin-bottom: 6px; letter-spacing: 0; text-transform: none; }
    .field { margin-bottom: 1.25rem; position: relative; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .field input, .field textarea { width: 100%; padding: 8px 36px 8px 10px; border: 1px solid transparent; border-radius: var(--radius); font-family: inherit; font-size: 14px; background: var(--bg2); color: var(--text); resize: vertical; line-height: 1.5; transition: background .1s, box-shadow .1s; box-shadow: inset 0 0 0 1px var(--border); }
    .field input:hover, .field textarea:hover { background: var(--bg3); }
    .field input:focus, .field textarea:focus { outline: none; background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
    .field textarea { min-height: 70px; padding: 10px 36px 10px 12px; }
    .mic-btn { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid var(--border2); background: var(--bg2); color: var(--text2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; padding: 0; }
    .mic-btn:hover { background: var(--bg3); color: var(--text); }
    .mic-btn.listening { background: var(--accent); color: #fff; border-color: var(--accent); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(194,65,12,.4); } 50% { box-shadow: 0 0 0 6px rgba(194,65,12,0); } }
    .block-step { display: flex; gap: 10px; margin-bottom: 6px; align-items: flex-start; padding: 6px 8px; border-radius: var(--radius); }
    .block-step:hover { background: var(--hover); }
    .block-num { min-width: 22px; height: 22px; background: var(--bg3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 1px; color: var(--text2); }
    .block-text { font-size: 14px; color: var(--text); line-height: 1.5; padding-top: 2px; }
    .checklist-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--radius); margin-bottom: 2px; cursor: pointer; transition: background .1s; font-size: 14px; color: var(--text); }
    .checklist-item:hover { background: var(--hover); }
    .check-box { width: 18px; height: 18px; border: 1.5px solid var(--border3); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .1s; background: var(--bg); }
    .check-box.checked { background: var(--accent); border-color: var(--accent); }
    .check-tick { display: none; width: 8px; height: 5px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(1px,-1px); }
    .check-box.checked .check-tick { display: block; }
    .type-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; cursor: pointer; transition: background .1s; background: var(--bg); }
    .type-card:hover { background: var(--bg2); }
    .type-card.selected { background: var(--bg2); box-shadow: inset 0 0 0 2px var(--accent); }
    .type-icon { font-size: 22px; line-height: 1; margin-top: 1px; }
    .type-card h4 { font-size: 15px; font-weight: 600; margin-bottom: 2px; color: var(--text); font-family: inherit; }
    .type-card p { font-size: 13px; color: var(--text2); line-height: 1.5; }
    /* Variante discrète : « Maîtriser un sujet » est une voie secondaire, moins mise en avant que la lecture */
    .type-card-sub { padding: 8px 12px; margin-top: 10px; background: transparent; opacity: .68; transition: opacity .1s, background .1s; }
    .type-card-sub:hover { opacity: 1; background: var(--bg2); }
    .type-card-sub.selected { opacity: 1; }
    .type-card-sub .type-icon { color: var(--text2); }
    .type-card-sub h4 { font-size: 13px; font-weight: 500; }
    .type-card-sub p { font-size: 12px; }
    .timer-display { text-align: center; padding: 1.5rem 0 1rem; }
    .timer-circle { width: 140px; height: 140px; border-radius: 50%; border: 2px solid var(--border2); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 1rem; }
    .timer-time { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .timer-label { font-size: 11px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
    .timer-phase-label { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 1rem; }
    .timer-btns { display: flex; gap: 8px; max-width: 300px; margin: 0 auto; }
    .timer-btns button { flex: 1; padding: 10px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: transparent; font-family: inherit; font-size: 14px; cursor: pointer; font-weight: 500; color: var(--text); transition: background .15s; }
    .timer-btns button:hover { background: var(--bg2); }
    .timer-btns button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    .timer-btns button.primary:hover { opacity: .85; }
    /* Synthèse — textareas plus grands */
    .synthesis-list { list-style: none; padding: 0; }
    .synthesis-item { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
    .synthesis-num { min-width: 28px; height: 28px; border: 0.5px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text2); flex-shrink: 0; margin-top: 8px; font-weight: 500; }
    .synthesis-item .input-wrap { flex: 1; }
    .synthesis-item textarea { width: 100%; padding: 12px 44px 12px 14px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-family: inherit; font-size: 14px; background: var(--bg); color: var(--text); min-height: 90px; resize: vertical; line-height: 1.55; }
    .synthesis-item textarea:focus { outline: none; border-color: var(--border3); }
    .citations-live { border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 10px; background: var(--bg2); }
    .citations-live-head { margin-bottom: 10px; }
    .citations-live-head h4 { font-size: 14px; font-weight: 500; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .citations-count { background: var(--accent); color: #fff; font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
    .citations-live-head small { font-size: 12px; color: var(--text2); line-height: 1.5; display: block; }
    .citations-live-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
    .citations-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 1rem; font-style: italic; }
    .citation-card { position: relative; padding: 10px 32px 10px 12px; background: var(--bg); border-radius: var(--radius); border-left: 3px solid var(--accent); }
    .citation-meta { font-size: 10px; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
    .citation-card blockquote { font-family: 'Newsreader', Georgia, serif; font-size: 14px; line-height: 1.5; color: var(--text); font-style: italic; }
    .citation-del { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; color: var(--text3); cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .citation-del:hover { background: var(--bg3); color: var(--accent); }
    .revision-card { background: var(--bg2); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; box-shadow: inset 0 0 0 1px var(--border); }
    .revision-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .revision-card p { font-size: 13px; color: var(--text2); line-height: 1.55; }
    .gcal-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .gcal-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--bg2); color: var(--text); border: 0.5px solid var(--border2); border-radius: var(--radius); text-decoration: none; font-size: 13px; font-weight: 500; transition: background .15s; }
    .gcal-btn:hover { background: var(--bg3); }
    .nav-row { display: flex; gap: 8px; margin-top: 2rem; }
    .btn-back { flex: 0 0 auto; padding: 6px 12px; background: transparent; border: none; border-radius: var(--radius); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text2); transition: background .1s; height: 32px; }
    .btn-back:hover { background: var(--hover); color: var(--text); }

    .suj-q-create-head { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }

    .suj-shelf { background: var(--bg2); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 1.25rem; box-shadow: inset 0 0 0 1px var(--border); }

<body>
<div class="layout">

    <div class="pdf-toolbar">
      <label class="btn">Ouvrir PDF<input id="pdf-file" type="file" accept="application/pdf" style="display:none"/></label>
      <button id="pdf-prev" disabled>‹</button>
      <span id="pdf-pagenum" style="font-size:12px;color:var(--text2)">—</span>
      <button id="pdf-next" disabled>›</button>

      <button id="pdf-zoom-in" disabled>+</button>
      <button id="pdf-highlight" class="highlight-btn" disabled title="Surligner la sélection (Ctrl+H)"><span class="ms" style="font-size:16px">ink_highlighter</span> Surligner</button>

  </div>
</div>
<div class="toast" id="toast"></div>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const STEPS_LIVRE = [
  {phase:0,id:'type',title:'Type de note',num:'Démarrage'},
  {phase:0,id:'ppu',title:'Définis ton objectif PPU',num:'Pré-lecture · 1/3'},
  {phase:0,id:'tdm',title:'Repère les chapitres clés',num:'Pré-lecture · 2/3'},
  {phase:0,id:'env',title:'Prépare ton environnement',num:'Pré-lecture · 3/3'},
  {phase:1,id:'lecture',title:'Lecture active par blocs',num:'Lecture · 1/2'},
  {phase:1,id:'pomodoro',title:'Lance ton bloc de lecture',num:'Lecture · 2/2'},
  {phase:2,id:'synthese',title:'Synthèse en 5 idées',num:'Post-lecture · 1/3'},
  {phase:2,id:'action',title:'Passe à l\'action',num:'Post-lecture · 2/3'},
  {phase:2,id:'revision',title:'Planifie ta révision',num:'Post-lecture · 3/3'},
];
const STEPS_CHAPITRE = [
  {phase:0,id:'type',title:'Type de note',num:'Démarrage'},
  {phase:0,id:'ppu',title:'Objectif du chapitre',num:'Pré-lecture · 1/2'},
  {phase:0,id:'env',title:'Prépare ton environnement',num:'Pré-lecture · 2/2'},
  {phase:1,id:'lecture',title:'Lecture active par blocs',num:'Lecture · 1/2'},
  {phase:1,id:'pomodoro',title:'Lance ton bloc de lecture',num:'Lecture · 2/2'},
  {phase:2,id:'synthese',title:'Synthèse du chapitre',num:'Post-lecture · 1/3'},
  {phase:2,id:'action',title:'Passe à l\'action',num:'Post-lecture · 2/3'},
  {phase:2,id:'revision',title:'Planifie ta révision',num:'Post-lecture · 3/3'},
];
const PHASES = ['Pré-lecture','Lecture','Post-lecture'];

// Méthode « Maîtriser un sujet » (d'après Oussama Ammar) —
// deux phases : cadrage rapide puis travail en profondeur.
const STEPS_SUJET = [
  {phase:0,id:'type',title:'Type de note',num:'Démarrage'},
  {phase:0,id:'suj-yt',title:'Dégrossis sur YouTube',num:'Cadrage · 1/2'},
  {phase:0,id:'suj-carto',title:'Cartographie les concepts',num:'Cadrage · 2/2'},
  {phase:1,id:'suj-livres',title:'Lis en diagonale les références',num:'Profondeur · 1/2'},
  {phase:1,id:'suj-50q',title:'Le crash-test des 50 questions',num:'Profondeur · 2/2'},
];
const PHASES_SUJET = ['Cadrage','Profondeur'];

function sujetInitial() {
  return {
    id: null, sujet:'', videos:'', carto:'', cartoLien:'', livres:'',
    questions: [],        // [{ q, avis: [{ text, ts }] }]
    qIndex: 0,
    ytVideos: [],         // suggestions IA [{ titre, requete, raison }]
    livresSugg: [],       // suggestions IA [{ titre, auteur, raison }]
    ytChecks:{'Sujet recherché sur YouTube':false,'Une dizaine de vidéos les plus vues sélectionnées':false,'Visionnées en accéléré, notes prises':false}
  };
}

// --- Persistance des sujets (localStorage) : chaque sujet est un
// dossier qu'on retrouve sur l'accueil sans repasser le parcours ---
function sujetsAll() { try { return JSON.parse(localStorage.getItem('li-sujets') || '[]'); } catch (_) { return []; } }
function sujetsWrite(list) { localStorage.setItem('li-sujets', JSON.stringify(list)); }
function sujetPersist() {
  const su = state.sujet;
  if (!su || !su.sujet || !su.sujet.trim()) return;
  if (!su.id) su.id = Date.now();
  su.updatedAt = Date.now();
  const list = sujetsAll();
  const i = list.findIndex(x => x.id === su.id);
  if (i >= 0) list[i] = su; else list.push(su);
  sujetsWrite(list);
  document.dispatchEvent(new CustomEvent('li:changed')); // synchro cloud différée
}
function sujetAnsweredCount(su) { return (su.questions || []).filter(q => (q.avis || []).length > 0).length; }

const state = {
  step: 0,
  noteType: null,
  bookTitle: '',
  bookAuthor: '',
  chapterTitle: '',
  ppu: {perso:'',precis:'',utile:''},
  tdm: {chapitres:'',ordre:''},
  env: {'Créneau calme bloqué':false,'Notifications coupées (mode avion)':false,'Eau à portée':false,'Lumière et position confortables':false},
  lecture: {question:''},
  timer: {seconds:25*60,running:false,interval:null,phase:'work',blocks:0},
  synthese: ['','','','',''],
  action: {conseil:'',quand:'',deadline:''},
  highlights: [],
  sujet: sujetInitial(),
  pdfPanelOpen: false,
  done: false
};

const pdf = { doc: null, page: 1, total: 0, scale: 1.2, name: '', textLayerDiv: null };

function getSteps() {
  if (state.noteType === 'chapitre') return STEPS_CHAPITRE;
  if (state.noteType === 'sujet') return STEPS_SUJET;
  return STEPS_LIVRE;

// ============= VOICE =============
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let currentRec = null;
let currentMicBtn = null;

function attachMic(wrapEl, targetEl) {
  if (!SpeechRec) return;
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'mic-btn'; btn.title = 'Dictée vocale (fr-FR)'; btn.innerHTML = icon('mic', 15);
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    if (currentRec && currentMicBtn === btn) { currentRec.stop(); return; }
    if (currentRec) { try { currentRec.stop(); } catch(_){} }
    const rec = new SpeechRec();
    rec.lang = 'fr-FR'; rec.continuous = true; rec.interimResults = true;
    let baseText = targetEl.value;
    if (baseText && !baseText.endsWith(' ') && !baseText.endsWith('\n')) baseText += ' ';
    rec.onresult = (ev) => {
      let finalT = '', interimT = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) finalT += r[0].transcript; else interimT += r[0].transcript;
      }
      if (finalT) baseText += finalT;
      targetEl.value = baseText + interimT;
      targetEl.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onend = () => {
      btn.classList.remove('listening');
      if (currentRec === rec) { currentRec = null; currentMicBtn = null; }
      targetEl.value = baseText.trim();
      targetEl.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onerror = (e) => {
      btn.classList.remove('listening');
      if (e.error === 'not-allowed') showToast('Micro refusé — autorise l\'accès');
      else if (e.error !== 'aborted' && e.error !== 'no-speech') showToast('Erreur micro : ' + e.error);
    };
    currentRec = rec; currentMicBtn = btn;
    btn.classList.add('listening');
    try { rec.start(); } catch(err) { btn.classList.remove('listening'); showToast('Micro indisponible'); }
  });
  wrapEl.appendChild(btn);
}

function wireVoiceOnAll() {
  document.querySelectorAll('.input-wrap').forEach(wrap => {
    if (wrap.dataset.micWired) return;
    const target = wrap.querySelector('input, textarea');
    if (!target) return;
    attachMic(wrap, target);
    wrap.dataset.micWired = '1';
  });
}

async function loadPdfFromInput(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

async function loadPdfFile(file) {
  if (!window.pdfjsLib) { showToast('PDF.js non chargé'); return; }
  const buf = await file.arrayBuffer();
  try {
    pdf.doc = await pdfjsLib.getDocument({ data: buf }).promise;
    pdf.total = pdf.doc.numPages;
    // Si une page de reprise a été demandée (depuis la lib), l'utiliser
    pdf.page = (pdf.startPage && pdf.startPage <= pdf.total) ? pdf.startPage : 1;
    pdf.startPage = null;
    pdf.name = file.name;
    state.pdfPanelOpen = true;

    // 🎯 Auto-fill du titre du livre depuis le nom du fichier
    if (!state.bookTitle) {
      const cleanName = file.name
        .replace(/\.pdf$/i, '')
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      state.bookTitle = cleanName;
      showToast('Titre détecté : ' + cleanName);
    }

    renderPdfPanel();
    await renderAllPages();
    // Si reprise demandée, scroller vers la page après le rendu initial
    if (pdf.page > 1) {
      setTimeout(() => scrollToPage(pdf.page), 100);
    }
    syncPdfPanel();
    re();
  } catch (err) {
    showToast('Erreur lors du chargement du PDF');
    console.error(err);
  }
}

// Défilement continu virtualisé

let _pdfObserver = null;
const _renderedPages = new Set();

async function renderAllPages() {
  if (!pdf.doc) return;
  const viewer = document.getElementById('pdf-viewer');
  viewer.innerHTML = '';
  _renderedPages.clear();
  if (_pdfObserver) { _pdfObserver.disconnect(); _pdfObserver = null; }

  // Dimensions de la page 1 pour estimer
  const firstPage = await pdf.doc.getPage(1);
  const firstViewport = firstPage.getViewport({ scale: pdf.scale });

  // Créer un slot vide par page
  for (let i = 1; i <= pdf.total; i++) {
    const slot = document.createElement('div');
    slot.className = 'pdf-page-slot';
    slot.dataset.page = i;
    slot.dataset.pageLabel = `Page ${i}`;
    slot.style.width = firstViewport.width + 'px';
    slot.style.height = firstViewport.height + 'px';
    slot.textContent = i;
    viewer.appendChild(slot);
  }

  // IntersectionObserver : ne rendre que les pages visibles ± 1
  _pdfObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const pageNum = parseInt(entry.target.dataset.page);
      if (entry.isIntersecting && !_renderedPages.has(pageNum)) {
        _renderedPages.add(pageNum);
        renderPageInSlot(pageNum, entry.target);
      }
    });
  }, { root: viewer, rootMargin: '800px' });

  viewer.querySelectorAll('.pdf-page-slot').forEach(s => _pdfObserver.observe(s));

  // Suivi de la page courante au scroll
  let scrollTimer = null;
  viewer.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(_updateCurrentPageFromScroll, 80);
  });

  // UI mise à jour
  document.getElementById('pdf-pagenum').textContent = `${pdf.page} / ${pdf.total}`;
  document.getElementById('pdf-filename').textContent = pdf.name;
  document.getElementById('pdf-prev').disabled = false;
  document.getElementById('pdf-next').disabled = false;
  document.getElementById('pdf-zoom-in').disabled = false;
  document.getElementById('pdf-zoom-out').disabled = false;
  document.getElementById('pdf-highlight').disabled = false;
}

async function renderPageInSlot(pageNum, slot) {
  try {
    const page = await pdf.doc.getPage(pageNum);
    const viewport = page.getViewport({ scale: pdf.scale });
    slot.style.width = viewport.width + 'px';
    slot.style.height = viewport.height + 'px';
    slot.textContent = '';
    slot.style.color = '';

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.display = 'block';
    slot.appendChild(canvas);

    const textLayer = document.createElement('div');
    textLayer.className = 'textLayer';
    textLayer.style.width = viewport.width + 'px';
    textLayer.style.height = viewport.height + 'px';
    slot.appendChild(textLayer);

    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const textContent = await page.getTextContent();
    pdfjsLib.renderTextLayer({ textContentSource: textContent, container: textLayer, viewport, textDivs: [] });
  } catch (err) {
    console.warn('renderPageInSlot error', pageNum, err);
  }
}

function _updateCurrentPageFromScroll() {
  const viewer = document.getElementById('pdf-viewer');
  if (!viewer) return;
  const viewportCenter = viewer.scrollTop + viewer.clientHeight / 2;
  let bestPage = pdf.page, bestDist = Infinity;
  viewer.querySelectorAll('.pdf-page-slot').forEach(slot => {
    const center = slot.offsetTop + slot.offsetHeight / 2;
    const dist = Math.abs(center - viewportCenter);
    if (dist < bestDist) { bestDist = dist; bestPage = parseInt(slot.dataset.page); }
  });
  if (bestPage !== pdf.page) {
    pdf.page = bestPage;
    const el = document.getElementById('pdf-pagenum');
    if (el) el.textContent = `${pdf.page} / ${pdf.total}`;
    if (window.libSetLastPosition && pdf.bookId) {
      window.libSetLastPosition(pdf.bookId, pdf.page, pdf.total);
    }
    if (window.dashboardTrackPage) window.dashboardTrackPage(pdf.bookId, pdf.page);
  }
}

function scrollToPage(pageNum) {
  const viewer = document.getElementById('pdf-viewer');
  if (!viewer) return;
  const slot = viewer.querySelector(`.pdf-page-slot[data-page="${pageNum}"]`);
  if (slot) {
    pdf.page = pageNum;
    viewer.scrollTo({ top: slot.offsetTop - 10, behavior: 'smooth' });
    const el = document.getElementById('pdf-pagenum');
    if (el) el.textContent = `${pdf.page} / ${pdf.total}`;
  }
}

// Popup automatique au-dessus de la sélection PDF
let hlPopup = null;
function ensureHlPopup() {
  if (hlPopup) return hlPopup;
  hlPopup = document.createElement('div');
  hlPopup.className = 'hl-popup';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.innerHTML = icon('ink_highlighter', 15) + ' Enregistrer le surlignage';
  // mousedown: empêcher la perte de focus/sélection avant le click
  btn.addEventListener('mousedown', (e) => e.preventDefault());
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    captureHighlight();
    hideHlPopup();
  });
  hlPopup.appendChild(btn);
  document.body.appendChild(hlPopup);
  return hlPopup;
}
function hideHlPopup() { if (hlPopup) hlPopup.style.display = 'none'; }

document.addEventListener('mouseup', () => {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) { hideHlPopup(); return; }
    const range = sel.getRangeAt(0);
    const node = range.commonAncestorContainer;
    const el = node.nodeType === 1 ? node : node.parentElement;
    if (!el || !el.closest('.textLayer')) { hideHlPopup(); return; }
    const rect = range.getBoundingClientRect();
    if (!rect.width || !rect.height) { hideHlPopup(); return; }
    const pop = ensureHlPopup();
    pop.style.display = 'block';
    // Positionner au-dessus de la sélection, centré
    const popW = pop.offsetWidth;
    const popH = pop.offsetHeight;
    let left = rect.left + window.scrollX + rect.width / 2 - popW / 2;
    let top = rect.top + window.scrollY - popH - 10;
    // Si trop haut (hors viewport), passer en-dessous
    if (top < window.scrollY + 4) {
      top = rect.bottom + window.scrollY + 10;
      pop.classList.add('below');
    } else {
      pop.classList.remove('below');
    }
    // Borner horizontalement
    left = Math.max(4, Math.min(window.innerWidth - popW - 4, left));
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }, 10);
});

document.addEventListener('mousedown', (e) => {
  if (hlPopup && !hlPopup.contains(e.target)) hideHlPopup();
});
window.addEventListener('scroll', hideHlPopup, true);

function gcalDateFormat(d) {
  // Format YYYYMMDDTHHMMSSZ (UTC)
  return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}

const APP_URL = 'https://augustinmarso.github.io/lecture-intelligente/';

function gcalUrl(title, startDate, durationMin, details, recur) {
  const end = new Date(startDate.getTime() + durationMin * 60000);
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: `${gcalDateFormat(startDate)}/${gcalDateFormat(end)}`,
    details: (details ? details + '\n\n' : '') + 'Ouvrir l\'app : ' + APP_URL,
    location: APP_URL
  });
  if (recur) params.set('recur', 'RRULE:' + recur);
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

  md += `- **Personnel** : ${state.ppu.perso || '—'}\n`;
  md += `- **Précis** : ${state.ppu.precis || '—'}\n`;
  md += `- **Utile** : ${state.ppu.utile || '—'}\n\n`;

  if (!isChapter) {
    md += `## Chapitres prioritaires\n\n`;
    md += `${state.tdm.chapitres || '—'}\n\n`;
    if (state.tdm.ordre) md += `**Ordre d'attaque** : ${state.tdm.ordre}\n\n`;
  }

  md += `## Question de lecture\n\n`;
  md += `${state.lecture.question || '—'}\n\n`;

  md += `## Synthèse\n\n`;
  md += synItems ? `${synItems}\n\n` : '—\n\n';

  md += `## Plan d'action\n\n`;
  md += `- **Conseil à tester** : ${state.action.conseil || '—'}\n`;
  md += `- **Quand** : ${state.action.quand || '—'}\n`;
  md += `- **Deadline bilan** : ${state.action.deadline || '—'}\n\n`;

  const cal = getCalendarEvents();
  md += `## Révision espacée\n\n`;
  md += `- [ ] **J+1 (${cal.j1Date.toLocaleDateString('fr-FR')})** — Relire la synthèse (2 min)\n`;
  md += `  - 📅 [Ajouter au Google Agenda](${cal.j1})\n`;
  md += `- [ ] **J+7 (${cal.j7Date.toLocaleDateString('fr-FR')})** — Bilan de l'action testée\n`;
  md += `  - 📅 [Ajouter au Google Agenda](${cal.j7})\n\n`;

  // 📜 Citations archivées (à la toute fin)
  if (state.highlights.length > 0) {
    md += `---\n\n`;
    md += `## 📜 Citations (${state.highlights.length})\n\n`;
    md += `*Passages surlignés pendant la lecture, archivés automatiquement.*\n\n`;
    state.highlights.forEach((h, i) => {
      md += `### ${i + 1}. Page ${h.page}\n\n`;
      md += `> ${h.text.replace(/\n+/g, '\n> ')}\n\n`;
    });
  }

  return md;
}

function defaultFilename() {
  const date = new Date().toISOString().slice(0, 10);
  const kind = state.noteType === 'chapitre' ? 'chapitre' : (state.noteType === 'sujet' ? 'sujet' : 'livre');
  const base = state.noteType === 'sujet' ? state.sujet.sujet : state.bookTitle;
  const slug = (base || 'lecture').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'lecture';
  return `${kind}-${slug}-${date}.md`;
}

async function saveMarkdownAs() {
  const md = generateMarkdown();
  const filename = defaultFilename();
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(md);
      await writable.close();
      showToast('Fichier enregistré ✓');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      console.warn('showSaveFilePicker failed, falling back', err);
    }
  }
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Téléchargement lancé');
}

function render() {
  const app = document.getElementById('app');
  const STEPS = getSteps();

  if (state.done) { app.innerHTML = renderDone(); bindEvents(); wireVoiceOnAll(); wirePdfControls(); syncPdfPanel(); return; }

  const s = STEPS[state.step];

  const topBar = `<div class="top-bar">
    <div class="app-title">
      <svg class="app-logo" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 6.5C10.5 5 8 4.5 4 4.8v12.5c4-.3 6.5.2 8 1.7"/>
        <path d="M12 6.5C13.5 5 16 4.5 20 4.8v12.5c-4-.3-6.5.2-8 1.7"/>
        <path d="M12 6.5V19"/>
      </svg>
      <span>Lecture Intelligente</span>
    </div>
    <button id="btn-pdf-toggle" class="btn-pdf-toggle ${state.pdfPanelOpen?'active':''}" title="Afficher/masquer le PDF"><span class="ms">picture_as_pdf</span></button>
  </div>`;

  let phases = '<div class="phase-bar">';
  getPhases().forEach((p,i) => {
    let cls = 'phase-tab';
    if (i === s.phase) cls += ' active';
    else if (i < s.phase) cls += ' done';
    phases += `<div class="${cls}">${i < s.phase ? '✓ ' : ''}${p}</div>`;
  });
  phases += '</div>';

  let dots = '<div class="progress-dots">';
  STEPS.forEach((_,i) => {
    let cls = 'dot';
    if (i === state.step) cls += ' active';
    else if (i < state.step) cls += ' done';
    dots += `<div class="${cls}"></div>`;
  });
  dots += '</div>';

  let body = '';
  if (s.id==='type') body = renderType();
  else if (s.id==='ppu') body = renderPPU();
  else if (s.id==='tdm') body = renderTDM();
  else if (s.id==='env') body = renderEnv();
  else if (s.id==='lecture') body = renderLecture();
  else if (s.id==='pomodoro') body = renderPomodoro();
  else if (s.id==='synthese') body = renderSynthese();
  else if (s.id==='action') body = renderAction();
  else if (s.id==='revision') body = renderRevision();
  else if (s.id==='suj-yt') body = renderSujetYt();
  else if (s.id==='suj-carto') body = renderSujetCarto();
  else if (s.id==='suj-livres') body = renderSujetLivres();
  else if (s.id==='suj-50q') body = renderSujet50q();

  app.innerHTML = topBar + phases + dots +
    `<div class="step-number">${s.num}</div><div class="step-title">${s.title}</div>` + body;

  bindEvents(); wireVoiceOnAll(); wirePdfControls(); syncPdfPanel();
  // Câbler les boutons de suppression de citations dans le panneau Pomodoro
  document.querySelectorAll('.citations-live-list .citation-del').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);
      state.highlights.splice(idx, 1);
      refreshCitationsLive();
      renderHighlightsBar();
    };
  });
}

// ============= LECTEUR VIDÉO INTÉGRÉ (mode cinéma) =============
// Regarder les vidéos sans sortir de l'app : recherche YouTube Data
// API (clé gratuite optionnelle) ou lien collé, lecteur embarqué en
// plein écran, notes datées sous la vidéo (sauvées dans le sujet).
const YT_KEY_STORE = 'li-yt-key';
function ytKey() { return (localStorage.getItem(YT_KEY_STORE) || '').trim(); }

let _theater = null; // { su, vi, save }

function ytExtractId(url) {
  const m = String(url || '').match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function ytTheaterEnsure() {
  let el = document.getElementById('yt-theater');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'yt-theater';
  el.innerHTML = `
    <div class="ytt-bar">
      <strong id="ytt-title"></strong>
      <div class="ytt-bar-actions">
        <button id="ytt-back" class="ytt-btn" style="display:none"><span class="ms" style="font-size:15px">arrow_back</span> Autres vidéos</button>
        <button id="ytt-close" class="ytt-btn" title="Quitter le mode cinéma">✕</button>
      </div>
    </div>
    <div class="ytt-scroll">
      <div id="ytt-stage"></div>
      <div class="ytt-notes">
        <label><span class="ms" style="font-size:15px">edit_note</span> Mes notes sur cette vidéo <span class="ytt-notes-hint">(enregistrées automatiquement)</span></label>
        <div class="input-wrap"><textarea id="ytt-notes" rows="5" placeholder="Ce que je retiens en regardant…"></textarea></div>
      </div>
    </div>`;
  document.body.appendChild(el);
  el.querySelector('#ytt-close').onclick = ytTheaterClose;
  el.querySelector('#ytt-back').onclick = () => { const v = _theater && _theater.su.ytVideos[_theater.vi]; if (v) { ytTheaterStage(); } };
  el.querySelector('#ytt-notes').addEventListener('input', (e) => {
    if (!_theater) return;
    _theater.su.ytVideos[_theater.vi].notes = e.target.value;
    _theater.save();
  });
  wireVoiceOnAll(); // dictée vocale sur les notes du mode cinéma
  return el;
}

function ytTheaterOpen(su, vi, save) {
  _theater = { su, vi, save };
  const el = ytTheaterEnsure();
  const v = su.ytVideos[vi];
  el.querySelector('#ytt-title').textContent = v.titre;
  el.querySelector('#ytt-notes').value = v.notes || '';
  el.classList.add('open');
  if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); }
  if (v.videoId) ytTheaterPlay(v.videoId, v.videoTitle || v.titre);
  else ytTheaterStage();
}

function ytTheaterClose() {
  const el = document.getElementById('yt-theater');
  if (el) el.classList.remove('open');
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); }
  const stage = document.getElementById('ytt-stage');
  if (stage) stage.innerHTML = ''; // stoppe la lecture
  _theater = null;
  re();
}

function ytTheaterPlay(videoId, titre) {
  const stage = document.getElementById('ytt-stage');
  const back = document.getElementById('ytt-back');
  if (back) back.style.display = '';
  stage.innerHTML = `<div class="ytt-player-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0" title="${escapeAttr(titre || '')}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
}

// Écran de choix : résultats de recherche in-app (clé YouTube) ou lien collé
async function ytTheaterStage() {
  const stage = document.getElementById('ytt-stage');
  const back = document.getElementById('ytt-back');
  if (back) back.style.display = 'none';
  const v = _theater.su.ytVideos[_theater.vi];

  if (!ytKey()) {
    stage.innerHTML = `
      <div class="ytt-setup">
        <p>Pour chercher et regarder les vidéos <strong>sans sortir de l'app</strong>, colle une clé <em>YouTube Data API</em> (gratuite — console.cloud.google.com, activer « YouTube Data API v3 », créer une clé). Elle reste sur ton ordinateur.</p>
        <div class="ytt-row"><input id="ytt-key" type="password" placeholder="Clé YouTube Data API (AIza…)"/><button id="ytt-key-save" class="ytt-btn">Activer</button></div>
        <p class="ytt-or">— ou —</p>
        <div class="ytt-row"><input id="ytt-paste" type="text" placeholder="Colle un lien YouTube (https://youtube.com/watch?v=…)"/><button id="ytt-paste-go" class="ytt-btn">Regarder</button></div>
      </div>`;
    stage.querySelector('#ytt-key-save').onclick = () => {
      localStorage.setItem(YT_KEY_STORE, stage.querySelector('#ytt-key').value.trim());
      if (ytKey()) ytTheaterStage(); else showToast('Colle d\'abord une clé');
    };
    const paste = () => {
      const id = ytExtractId(stage.querySelector('#ytt-paste').value);
      if (!id) { showToast('Lien YouTube non reconnu'); return; }
      v.videoId = id; _theater.save();
      ytTheaterPlay(id, v.titre);
    };
    stage.querySelector('#ytt-paste-go').onclick = paste;
    stage.querySelector('#ytt-paste').addEventListener('keydown', (e) => { if (e.key === 'Enter') paste(); });
    return;
  }

  stage.innerHTML = `<div class="ytt-setup"><p>Recherche des vidéos pour «&nbsp;${escapeHtml(v.requete)}&nbsp;»…</p></div>`;
  try {
    const resp = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=9&q=${encodeURIComponent(v.requete)}&key=${encodeURIComponent(ytKey())}`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message || 'Erreur YouTube');
    const items = (data.items || []).filter(x => x.id && x.id.videoId);
    if (!items.length) { stage.innerHTML = '<div class="ytt-setup"><p>Aucune vidéo trouvée — modifie la requête ou colle un lien.</p></div>'; return; }
    stage.innerHTML = `<div class="ytt-results">${items.map(x => `
      <div class="ytt-result" data-vid="${x.id.videoId}" data-t="${escapeAttr(x.snippet.title)}">
        <img src="${x.snippet.thumbnails && x.snippet.thumbnails.medium ? x.snippet.thumbnails.medium.url : ''}" alt=""/>
        <div class="ytt-result-info"><strong>${escapeHtml(x.snippet.title)}</strong><span>${escapeHtml(x.snippet.channelTitle)}</span></div>
      </div>`).join('')}</div>`;
    stage.querySelectorAll('.ytt-result').forEach(r => {
      r.onclick = () => {
        v.videoId = r.dataset.vid;
        v.videoTitle = r.dataset.t;
        _theater.save();
        ytTheaterPlay(v.videoId, v.videoTitle);
      };
    });
  } catch (e) {
    stage.innerHTML = `<div class="ytt-setup"><p>Recherche impossible&nbsp;: ${escapeHtml(e.message)}</p><div class="ytt-row"><input id="ytt-paste" type="text" placeholder="Colle un lien YouTube…"/><button id="ytt-paste-go" class="ytt-btn">Regarder</button></div></div>`;
    stage.querySelector('#ytt-paste-go').onclick = () => {
      const id = ytExtractId(stage.querySelector('#ytt-paste').value);
      if (!id) { showToast('Lien YouTube non reconnu'); return; }
      v.videoId = id; _theater.save();
      ytTheaterPlay(id, v.titre);
    };
  }
}

      <div class="recap-block"><strong>Références</strong><span class="recap-val">${escapeHtml(su.livres) || '—'}</span></div>

}

      ${state.highlights.length ? `<div class="recap-block"><strong><span class="ms" style="font-size:14px">ink_highlighter</span> Passages surlignés</strong><span class="recap-val">${state.highlights.length} passage${state.highlights.length>1?'s':''} dans le PDF</span></div>` : ''}

        <a class="gcal-btn" href="${cal.j7}" target="_blank" rel="noopener"><span class="ms" style="font-size:16px">monitoring</span> J+7 — Bilan (${cal.j7Date.toLocaleDateString('fr-FR')})</a>

// ============= EVENTS =============
function bindEvents() {
  const STEPS = getSteps();
  const s = state.done ? null : STEPS[state.step];

  document.querySelectorAll('textarea, input[type=text]').forEach(el => {
    if (el.classList.contains('syn-input')) return;
    el.addEventListener('input', () => {
      const id = el.id;
      if (id==='ppu-perso') state.ppu.perso = el.value;
      else if (id==='ppu-precis') state.ppu.precis = el.value;
      else if (id==='ppu-utile') state.ppu.utile = el.value;
      else if (id==='tdm-ch') state.tdm.chapitres = el.value;
      else if (id==='tdm-ordre') state.tdm.ordre = el.value;
      else if (id==='lec-q') state.lecture.question = el.value;
      else if (id==='act-conseil') state.action.conseil = el.value;
      else if (id==='act-quand') state.action.quand = el.value;
      else if (id==='act-deadline') state.action.deadline = el.value;
      else if (id==='book-title') state.bookTitle = el.value;
      else if (id==='book-author') state.bookAuthor = el.value;
      else if (id==='chapter-title') state.chapterTitle = el.value;
      else if (id==='suj-sujet') state.sujet.sujet = el.value;
      else if (id==='suj-videos') state.sujet.videos = el.value;
      else if (id==='suj-carto') state.sujet.carto = el.value;
      else if (id==='suj-carto-lien') state.sujet.cartoLien = el.value;
      else if (id==='suj-livres') state.sujet.livres = el.value;
      if (id && id.startsWith('suj-') && id !== 'suj-avis-input') sujetPersist();
      const btn = document.getElementById('btn-next');
      if (btn && s) updateNextBtn(btn, s);
    });
  });

  document.querySelectorAll('.syn-input').forEach(el => {
    el.addEventListener('input', () => {
      state.synthese[parseInt(el.dataset.i)] = el.value;
      const btn = document.getElementById('btn-next');
      if (btn) btn.disabled = state.synthese.filter(x => x.trim()).length < 3;
    });
  });

  document.querySelectorAll('.checklist-item').forEach(el => {
    el.addEventListener('click', () => {
      const group = el.dataset.sujetGroup;
      if (group) { state.sujet[group][el.dataset.key] = !state.sujet[group][el.dataset.key]; sujetPersist(); }
      else state.env[el.dataset.key] = !state.env[el.dataset.key];
      re();
    });
  });

  // --- Méthode sujet : générations IA + questions/avis + accueil ---
  const _aiReady = () => {
    if (window.aiCall && window.aiIsConfigured && window.aiIsConfigured()) return true;
    showToast('Configure une clé IA dans la bibliothèque (barre « Assistant IA »)');
    return false;
  };
  const _busy = (btn, label) => { btn.disabled = true; btn.textContent = label; };

  const btnGen50 = document.getElementById('suj-gen-50q');
  if (btnGen50) btnGen50.addEventListener('click', async () => {
    if (!_aiReady()) return;
    _busy(btnGen50, 'Génération de 5 questions…');
    try {
      const existantes = (state.sujet.questions || []).map((x, i) => `${i + 1}. ${x.q}`).join('\n');
      const res = await window.aiCall({
        system: 'Tu es un recruteur ultra exigeant chargé d\'évaluer l\'expertise réelle d\'un candidat. Tu poses des questions pointues, techniques et concrètes, jamais génériques.',
        user: `Sujet : ${state.sujet.sujet}.\n\nGénère exactement 5 nouvelles questions ultra-pointues permettant d'évaluer l'expertise réelle de quelqu'un dans ce domaine. Chaque question doit être autosuffisante, sans réponse fournie.${existantes ? '\n\nQuestions déjà posées — n\'en répète aucune et varie les angles :\n' + existantes : ''}`,
        schema: { type: 'object', properties: { questions: { type: 'array', items: { type: 'string' } } }, required: ['questions'], additionalProperties: false },
        maxTokens: 1200
      });
      const dejaLa = (state.sujet.questions || []).length === 0;
      const nouvelles = (res.questions || []).slice(0, Math.max(0, 50 - (state.sujet.questions || []).length)).map(q => ({ q, avis: [] }));
      state.sujet.questions = (state.sujet.questions || []).concat(nouvelles);
      if (dejaLa) state.sujet.qIndex = 0;
      else state.sujet.qIndex = state.sujet.questions.length - nouvelles.length; // se placer sur la 1re nouvelle
      sujetPersist();
      re();
      showToast(`${nouvelles.length} nouvelle${nouvelles.length > 1 ? 's' : ''} question${nouvelles.length > 1 ? 's' : ''} (${state.sujet.questions.length}/50)`);
    } catch (e) {
      showToast(e.message);
      re();
    }
  });

  const _ankiVersoFromQ = (q) => (q.avis || []).map(a =>
    new Date(a.ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) + ' — ' + a.text
  ).join('\n\n');

  const btnAvisAdd = document.getElementById('suj-avis-add');
  if (btnAvisAdd) btnAvisAdd.addEventListener('click', () => {
    const ta = document.getElementById('suj-avis-input');
    const v = (ta.value || '').trim();
    if (!v) { showToast('Écris d\'abord ton avis'); return; }
    const q = state.sujet.questions[state.sujet.qIndex];
    (q.avis = q.avis || []).push({ text: v, ts: Date.now() });
    sujetPersist();
    // Question répondue → part automatiquement dans Anki (1re réponse)
    if (q.avis.length === 1 && window.ankiQuickAdd) {
      window.ankiQuickAdd(q.q, v, state.sujet.sujet);
    }
    re();
  });

  const btnQAnki = document.getElementById('suj-q-anki');
  if (btnQAnki) btnQAnki.addEventListener('click', () => {
    const q = state.sujet.questions[state.sujet.qIndex];
    if (!q) return;
    if (!(q.avis || []).length) { showToast('Réponds d\'abord à la question'); return; }
    if (window.ankiQuickAdd) window.ankiQuickAdd(q.q, _ankiVersoFromQ(q), state.sujet.sujet);
  });

  const btnQAdd = document.getElementById('suj-q-add-btn');
  if (btnQAdd) {
    const addOwn = () => {
      const inp = document.getElementById('suj-q-new');
      const v = (inp.value || '').trim();
      if (!v) { showToast('Écris d\'abord ta question'); return; }
      state.sujet.questions = state.sujet.questions || [];
      state.sujet.questions.push({ q: v, avis: [], perso: true });
      state.sujet.qIndex = state.sujet.questions.length - 1;
      sujetPersist();
      re();
      showToast('Question ajoutée');
    };
    btnQAdd.addEventListener('click', addOwn);
    document.getElementById('suj-q-new').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addOwn(); } });
  }
  const qPrev = document.getElementById('suj-q-prev');
  if (qPrev) qPrev.addEventListener('click', () => { state.sujet.qIndex--; sujetPersist(); re(); });
  const qNext = document.getElementById('suj-q-next');
  if (qNext) qNext.addEventListener('click', () => { state.sujet.qIndex++; sujetPersist(); re(); });

  const btnGenVid = document.getElementById('suj-gen-videos');
  if (btnGenVid) btnGenVid.addEventListener('click', async () => {
    if (!_aiReady()) return;
    _busy(btnGenVid, 'Recherche de vidéos…');
    try {
      const deja = (state.sujet.ytVideos || []).map(v => v.titre).join(' ; ');
      const res = await window.aiCall({
        system: 'Tu recommandes des vidéos YouTube pour découvrir un domaine. Tu proposes des thèmes de vidéos réellement populaires et vulgarisés, avec pour chacun une requête de recherche YouTube efficace en français ou en anglais selon le domaine.',
        user: `Sujet : ${state.sujet.sujet}.\n\nPropose 6 vidéos ou thèmes de vidéos YouTube adaptés et intéressants pour dégrossir ce domaine (les contenus les plus vulgarisés et appréciés). Pour chaque proposition : "titre" court, "requete" de recherche YouTube précise, "raison" en une phrase.${deja ? '\nDéjà proposé (ne pas répéter) : ' + deja : ''}`,
        schema: { type: 'object', properties: { videos: { type: 'array', items: { type: 'object', properties: { titre: { type: 'string' }, requete: { type: 'string' }, raison: { type: 'string' } }, required: ['titre', 'requete', 'raison'], additionalProperties: false } } }, required: ['videos'], additionalProperties: false },
        maxTokens: 2000
      });
      state.sujet.ytVideos = (state.sujet.ytVideos || []).concat(res.videos || []);
      sujetPersist();
      re();
    } catch (e) { showToast(e.message); re(); }
  });

  const btnGenLiv = document.getElementById('suj-gen-livres');
  if (btnGenLiv) btnGenLiv.addEventListener('click', async () => {
    if (!_aiReady()) return;
    _busy(btnGenLiv, 'Recherche de livres…');
    try {
      const deja = (state.sujet.livresSugg || []).map(l => l.titre).join(' ; ');
      const res = await window.aiCall({
        system: 'Tu recommandes des livres de référence réels et reconnus pour maîtriser un domaine. Jamais de titre inventé.',
        user: `Sujet : ${state.sujet.sujet}.\n\nPropose 6 livres de référence adaptés à ce domaine d'expertise, du plus accessible au plus pointu. Pour chacun : "titre" exact, "auteur", "raison" en une phrase.${deja ? '\nDéjà proposé (ne pas répéter) : ' + deja : ''}`,
        schema: { type: 'object', properties: { livres: { type: 'array', items: { type: 'object', properties: { titre: { type: 'string' }, auteur: { type: 'string' }, raison: { type: 'string' } }, required: ['titre', 'auteur', 'raison'], additionalProperties: false } } }, required: ['livres'], additionalProperties: false },
        maxTokens: 2000
      });
      state.sujet.livresSugg = (state.sujet.livresSugg || []).concat(res.livres || []);
      sujetPersist();
      re();
    } catch (e) { showToast(e.message); re(); }
  });

  // Chercher dans les PDF de l'ordinateur (dossier connecté via shelf.js)
  const btnShelfT = document.getElementById('suj-shelf-toggle');
  if (btnShelfT) btnShelfT.addEventListener('click', async () => {
    if (_sujShelfOpen) { _sujShelfOpen = false; re(); return; }
    if (!window.shelfIsConnected || !window.shelfScan) { showToast('Bibliothèque de l\'ordinateur indisponible'); return; }
    if (!window.shelfIsConnected()) {
      const ok = await window.shelfConnect();
      const modal = document.getElementById('lib-modal');
      if (modal) modal.classList.remove('open');
      if (!ok) return;
    }
    _busy(btnShelfT, 'Analyse du dossier…');
    _sujShelfFiles = await window.shelfScan();
    _sujShelfOpen = true;
    re();
  });
  const shelfQ = document.getElementById('suj-shelf-q');
  if (shelfQ) shelfQ.addEventListener('input', () => {
    _sujShelfQuery = shelfQ.value;
    const list = document.getElementById('suj-shelf-list');
    if (list) list.innerHTML = _sujShelfRows();
  });
  const shelfList = document.getElementById('suj-shelf-list');
  if (shelfList) shelfList.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-shelf-act]');
    if (!btn) return;
    const entry = (_sujShelfFiles || [])[parseInt(btn.dataset.si)];
    if (!entry) return;
    if (btn.dataset.shelfAct === 'add') {
      const ligne = entry.name.replace(/\.pdf$/i, '');
      if (state.sujet.livres.includes(ligne)) { showToast('Déjà dans ta liste'); return; }
      state.sujet.livres = state.sujet.livres.trim() ? state.sujet.livres.replace(/\s*$/, '') + '\n' + ligne : ligne;
      sujetPersist();
      re();
      showToast('Ajouté à tes références');
    } else if (btn.dataset.shelfAct === 'open') {
      await window.shelfOpenEntry(entry);
    }
  });

  document.querySelectorAll('.suj-livre-add').forEach(btn => {
    btn.addEventListener('click', () => {
      const l = state.sujet.livresSugg[parseInt(btn.dataset.i)];
      if (!l) return;
      const ligne = `${l.titre} — ${l.auteur}`;
      if (state.sujet.livres.includes(ligne)) { showToast('Déjà dans ta liste'); return; }
      state.sujet.livres = state.sujet.livres.trim() ? state.sujet.livres.replace(/\s*$/, '') + '\n' + ligne : ligne;
      sujetPersist();
      re();
    });
  });

  // Accueil : reprendre un sujet sans repasser le parcours
  document.querySelectorAll('.suj-home-open').forEach(btn => {
    btn.addEventListener('click', () => {
      const rec = sujetsAll().find(x => x.id === parseInt(btn.dataset.id));
      if (!rec) return;
      state.sujet = Object.assign(sujetInitial(), rec);
      state.noteType = 'sujet';
      state.step = Math.max(1, STEPS_SUJET.findIndex(s => s.id === btn.dataset.goto));
      re();
    });
  });
  document.querySelectorAll('.suj-home-del').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Supprimer ce sujet, ses questions et tous tes avis ?')) return;
      const id = parseInt(btn.dataset.id);
      sujetsWrite(sujetsAll().filter(x => x.id !== id));
      // Pierre tombale pour que la synchro cloud ne le ressuscite pas
      try {
        const t = Object.assign({ sujets: [], notes: [] }, JSON.parse(localStorage.getItem('li-tomb') || '{}'));
        t.sujets.push(id);
        localStorage.setItem('li-tomb', JSON.stringify(t));
      } catch (_) {}
      document.dispatchEvent(new CustomEvent('li:changed'));
      re();
    });
  });
  document.querySelectorAll('.suj-home-detail').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      if (_sujHomeOpen.has(id)) _sujHomeOpen.delete(id); else _sujHomeOpen.add(id);
      re();
    });
  });
  document.querySelectorAll('.suj-det-q').forEach(row => {
    row.addEventListener('click', () => {
      const rec = sujetsAll().find(x => x.id === parseInt(row.dataset.id));
      if (!rec) return;
      state.sujet = Object.assign(sujetInitial(), rec);
      state.sujet.qIndex = parseInt(row.dataset.qi);
      state.noteType = 'sujet';
      state.step = STEPS_SUJET.findIndex(s => s.id === 'suj-50q');
      re();
    });
  });

  // Mode cinéma : depuis l'étape YouTube (état courant, persist standard)
  document.querySelectorAll('.suj-video-watch').forEach(btn => {
    btn.addEventListener('click', () => ytTheaterOpen(state.sujet, parseInt(btn.dataset.i), sujetPersist));
  });
  // Mode cinéma : depuis l'onglet Avancement de l'accueil (record persisté)
  document.querySelectorAll('.suj-det-video').forEach(btn => {
    btn.addEventListener('click', () => {
      const list = sujetsAll();
      const rec = list.find(x => x.id === parseInt(btn.dataset.id));
      if (!rec) return;
      ytTheaterOpen(rec, parseInt(btn.dataset.vi), () => { rec.updatedAt = Date.now(); sujetsWrite(list); });
    });
  });

  document.querySelectorAll('.type-card').forEach(el => {
    el.addEventListener('click', () => { state.noteType = el.dataset.type; re(); });
  });

  const btnPdf = document.getElementById('btn-pdf-toggle');
  if (btnPdf) btnPdf.addEventListener('click', () => {
    state.pdfPanelOpen = !state.pdfPanelOpen;
    renderPdfPanel(); syncPdfPanel();
  });

  const btnNext = document.getElementById('btn-next');
  if (btnNext) btnNext.addEventListener('click', () => {
    if (state.step < getSteps().length - 1) state.step++;
    else state.done = true;
    re();
  });

  const btnBack = document.getElementById('btn-back');
  if (btnBack) btnBack.addEventListener('click', () => { if (state.step > 0) { state.step--; re(); } });

  const btnRestart = document.getElementById('btn-restart');
  if (btnRestart) btnRestart.addEventListener('click', () => {
    clearInterval(state.timer.interval);
    Object.assign(state, {
      step:0, noteType:null, bookTitle:'', bookAuthor:'', chapterTitle:'',
      ppu:{perso:'',precis:'',utile:''}, tdm:{chapitres:'',ordre:''},
      env:{'Créneau calme bloqué':false,'Notifications coupées (mode avion)':false,'Eau à portée':false,'Lumière et position confortables':false},
      lecture:{question:''}, timer:{seconds:25*60,running:false,interval:null,phase:'work',blocks:0},
      synthese:['','','','',''], action:{conseil:'',quand:'',deadline:''},
      highlights: [], sujet: sujetInitial(), done:false
    });
    re();
  });

  const btnSaveAs = document.getElementById('btn-save-as');
  if (btnSaveAs) btnSaveAs.addEventListener('click', saveMarkdownAs);

  const btnToggle = document.getElementById('btn-toggle-timer');
  if (btnToggle) btnToggle.addEventListener('click', toggleTimer);

  const btnReset = document.getElementById('btn-reset-timer');
  if (btnReset) btnReset.addEventListener('click', () => {
    clearInterval(state.timer.interval);
    state.timer.running = false;
    state.timer.seconds = state.timer.phase === 'work' ? 25*60 : 5*60;
    re();
  });
}

function updateNextBtn(btn, s) {
  if (s.id==='type') btn.disabled = !state.noteType || (state.noteType==='sujet' && !state.sujet.sujet.trim());
  else if (s.id==='ppu') btn.disabled = !state.ppu.perso || !state.ppu.precis || !state.ppu.utile;
  else if (s.id==='tdm') btn.disabled = !state.tdm.chapitres;
  else if (s.id==='lecture') btn.disabled = !state.lecture.question;
  else if (s.id==='action') btn.disabled = !state.action.conseil || !state.action.quand;
  else if (s.id==='suj-yt') btn.disabled = !state.sujet.videos.trim();
  else if (s.id==='suj-carto') btn.disabled = !state.sujet.carto.trim();
  else if (s.id==='suj-livres') btn.disabled = !state.sujet.livres.trim();
}

function toggleTimer() {
  const t = state.timer;
  if (t.running) {
    clearInterval(t.interval); t.running = false;
    if (window.dashboardStopReadingTimer) window.dashboardStopReadingTimer();
    re();
  } else {
    t.running = true;
    if (window.dashboardStartReadingTimer && t.phase === 'work') window.dashboardStartReadingTimer();
    t.interval = setInterval(() => {
      if (t.seconds > 0) {
        t.seconds--;
        const el = document.getElementById('timer-time');
        if (el) el.textContent = `${Math.floor(t.seconds/60).toString().padStart(2,'0')}:${(t.seconds%60).toString().padStart(2,'0')}`;
      } else {
        clearInterval(t.interval); t.running = false;
        if (t.phase === 'work') { t.phase = 'pause'; t.seconds = 5*60; t.blocks++; }
        else { t.phase = 'work'; t.seconds = 25*60; }
        re();
      }
    }, 1000);
    re();
  }
}
